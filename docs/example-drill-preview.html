    let acc = 0; const amp = Math.max(0.5, w * 0.9); pts = d.map((pt, i) => { const p0 = d[Math.max(0, i - 1)], p1 = d[Math.min(d.length - 1, i + 1)]; const dx = p1.x - p0.x, dy = p1.y - p0.y, mm = Math.hypot(dx, dy) || 1; if (i > 0) acc += Math.hypot(d[i].x - d[i - 1].x, d[i].y - d[i - 1].y); const edge = Math.min(1, i / 3, (d.length - 1 - i) / 3); const off = Math.sin((acc / 2.8) * Math.PI * 2) * amp * edge; return { x: pt.x + (-dy / mm) * off, y: pt.y + (dx / mm) * off }; });
  }
  const dash = m.style === "dashed" ? ` stroke-dasharray="${f(w * 2.6)} ${f(w * 1.9)}"` : m.style === "dotted" ? ` stroke-dasharray="0.02 ${f(w * 2)}"` : "";
  const ptStr = pts.map(q => `${f(q.x)},${f(q.y)}`).join(" ");
  const fillEl = m.fill ? `<polygon points="${ptStr}" fill="${m.fill}" fill-opacity="${f(m.fillOp != null ? m.fillOp : 0.25)}" stroke="none"/>` : "";
  return `${fillEl}<polyline points="${ptStr}" fill="none" stroke="${m.color}" stroke-width="${f(w)}"${dash} stroke-linecap="round" stroke-linejoin="round" opacity="0.94"/>`;
}
/* piece icons                                                         */
function piece(p) {
  if (p.kind === "mark") return markMarkup(p);
  const rot = (a = p.facing || 0) => `translate(${f(p.x)} ${f(p.y)}) rotate(${f(a)})`;
  if (p.kind === "player")
    return `<g><ellipse cx="${f(p.x)}" cy="${f(p.y + 0.5)}" rx="3.7" ry="3.9" fill="#0a1016" opacity="0.15"/>`
      + `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="3.4" fill="${p.color}" stroke="#fff" stroke-width="0.5"/>`
      + `<text x="${f(p.x)}" y="${f(p.y) + 1.05}" font-weight="800" font-size="3" text-anchor="middle" fill="#fff">${p.label || ""}</text></g>`;
  if (p.kind === "puck")
    return `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="1.5" fill="${V("db-ice-ink", L["ice-ink"])}" stroke="${V("db-ice", L.ice)}" stroke-width="0.4"/>`;
  if (p.kind === "cone")
    return `<path transform="${rot()}" d="M 0 -2.4 L 2.2 1.8 L -2.2 1.8 Z" fill="${p.color}" stroke="#fff" stroke-width="0.35" stroke-linejoin="round"/>`;
  if (p.kind === "net") {
    const CAGE = "M 0 -3.75 L -1.7 -3.75 Q -4.15 -3.75 -4.15 -1.5 L -4.15 1.5 Q -4.15 3.75 -1.7 3.75 L 0 3.75";
    return `<g transform="${rot()} scale(${p.size || 1})">`
      + (p.crease ? `<path d="M 0 -7.5 A 7.5 7.5 0 0 1 0 7.5" fill="none" stroke="#d7263d" stroke-width="0.42" opacity="0.85" stroke-linecap="round"/>` : "")
      + `<path d="${CAGE} Z" fill="rgba(230,238,246,0.3)" stroke="none"/>`
      + `<g stroke="#9fb0c0" stroke-width="0.13" opacity="0.85" fill="none"><path d="M -0.4 -2.9 L -3.7 -1.7 M -0.4 -1.45 L -3.95 -0.85 M -0.4 1.45 L -3.95 0.85 M -0.4 2.9 L -3.7 1.7"/><path d="M -1.2 -3.3 L -1.2 3.3 M -2.4 -3.1 L -2.4 3.1 M -3.4 -2 L -3.4 2"/><path d="M -0.2 0 L -4.0 0"/></g>`
      + `<path d="${CAGE}" fill="none" stroke="${p.color}" stroke-width="0.55" stroke-linejoin="round" stroke-linecap="round"/>`
      + `<line x1="0" y1="-4.05" x2="0" y2="4.05" stroke="${p.color}" stroke-width="0.8" stroke-linecap="round"/>`
      + `<circle cx="0" cy="-3.75" r="0.82" fill="${p.color}"/><circle cx="0" cy="3.75" r="0.82" fill="${p.color}"/>`
      + (p.goalie ? `<g transform="rotate(${f(-(p.facing || 0))} -0.5 0)"><circle cx="-0.5" cy="0" r="1.55" fill="#2f9e57" stroke="#fff" stroke-width="0.3"/><text x="-0.5" y="0.72" text-anchor="middle" font-size="2.1" font-weight="800" fill="#fff" font-family="system-ui,sans-serif" paint-order="stroke" stroke="rgba(0,0,0,0.35)" stroke-width="0.18">G</text></g>` : "") + `</g>`;
  }
  if (p.kind === "tire") {
    let ticks = "";
    for (let k = 0; k < 12; k++) { const a = (k / 12) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      ticks += `<line x1="${f(c * 1.45)}" y1="${f(s * 1.45)}" x2="${f(c * 2.55)}" y2="${f(s * 2.55)}" stroke="#3a3a3e" stroke-width="0.28" stroke-linecap="round"/>`; }
    return `<g transform="translate(${f(p.x)} ${f(p.y)}) scale(${p.size || 1})">`
      + `<circle cx="0" cy="0" r="2.0" fill="none" stroke="${p.color}" stroke-width="1.55"/>`
      + `<circle cx="0" cy="0" r="2.78" fill="none" stroke="#000" stroke-width="0.2" opacity="0.55"/>`
      + `<circle cx="0" cy="0" r="1.22" fill="none" stroke="#000" stroke-width="0.2" opacity="0.55"/>${ticks}`
      + (p.goalie ? `<circle cx="0" cy="-3.5" r="1.4" fill="#2f9e57" stroke="#fff" stroke-width="0.3"/><text x="0" y="-2.85" text-anchor="middle" font-size="1.9" font-weight="800" fill="#fff" font-family="system-ui,sans-serif" paint-order="stroke" stroke="rgba(0,0,0,0.35)" stroke-width="0.16">G</text>` : "") + `</g>`;
  }
  if (p.kind === "bumper") {
    const foam = p.color && p.color !== "#4d6fa6" ? p.color : "#1b1e22";
    return `<g transform="${rot()}"><rect x="-7.7" y="-1.35" width="15.4" height="2.7" rx="0.45" fill="${foam}" stroke="#40464e" stroke-width="0.3"/>`
      + `<path d="M -3.9 -1 L -3.9 1 M 0 -1 L 0 1 M 3.9 -1 L 3.9 1" stroke="#565c64" stroke-width="0.18" opacity="0.5"/></g>`;
  }
  if (p.kind === "stick")
    return `<g transform="${rot()}"><rect x="-5.85" y="-0.5" width="0.7" height="1" rx="0.3" fill="#e7ebef" stroke="#9aa2ab" stroke-width="0.1"/>`
      + `<rect x="-5.3" y="-0.32" width="9" height="0.64" rx="0.3" fill="${p.color}" stroke="#0c1014" stroke-width="0.12"/>`
      + `<path d="M 3.5 -0.32 L 6.3 -1.85 Q 6.95 -1.6 6.85 -0.95 L 4.3 0.32 Z" fill="${p.color}" stroke="#0c1014" stroke-width="0.12" stroke-linejoin="round"/></g>`;
  if (p.kind === "deker")
    return `<g transform="${rot()}"><rect x="-2.7" y="-0.5" width="0.9" height="2.4" rx="0.32" fill="#3a3f47" stroke="#20242a" stroke-width="0.16"/>`
      + `<rect x="1.8" y="-0.5" width="0.9" height="2.4" rx="0.32" fill="#3a3f47" stroke="#20242a" stroke-width="0.16"/>`
      + `<rect x="-3.35" y="-1.2" width="6.1" height="0.82" rx="0.4" fill="${p.color}" stroke="#5a4420" stroke-width="0.2"/>`
      + `<path d="M 2.55 -1.1 Q 3.75 -0.95 3.8 0.25" fill="none" stroke="${p.color}" stroke-width="0.75" stroke-linecap="round"/></g>`;
  if (p.kind === "passer")
    return `<g transform="${rot()}"><rect x="-1.6" y="-2.6" width="3.2" height="5.2" rx="0.5" fill="rgba(210,225,240,0.14)" stroke="${p.color}" stroke-width="0.5"/>`
      + `<rect x="0.85" y="-2.6" width="0.75" height="5.2" rx="0.3" fill="${p.color}"/></g>`;
  return "";
}

/* ------------------------------------------------------------------ */
/* routes + chain                                                      */
function routePath(p, pieces) {
  if (!p.path.length) return "";
  // the START lifts off the player; the end arrow sits AT the last waypoint.
  // Each segment draws in the hockey-diagram style for how it's skated: WITH the
  // puck = wiggle, backward = zigzag, otherwise a straight/curved line.
  const last = p.path.length - 1;
  const carry = pieces ? carrySegsOf(p, pieces) : new Set();
  const startTrim = trimSegStart({ x: p.x, y: p.y }, p.path[0], 3.6);
  const startPt = startTrim ? startTrim.start : { x: p.x, y: p.y };
  const stroke = `fill="none" stroke="${p.color}" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"`;
  let lines = "";
  p.path.forEach((s0, i) => {
    const segPrev = i === 0 ? startPt : { x: p.path[i - 1].x, y: p.path[i - 1].y };
    const s = i === 0 && startTrim ? startTrim.seg : s0;
    const arrow = i === last ? ' marker-end="url(#arrowR)"' : "";
    if (carry.has(i))
      lines += `<polyline points="${wigglePoints(segPrev, s, 1, i === last)}" ${stroke}${arrow}/>`;
    else
      lines += `<path d="M ${f(segPrev.x)} ${f(segPrev.y)} ${segCmd(s)}" ${stroke}${arrow}/>`;
  });
  // number only the waypoints where something happens; shaping points get no dot
  const ev = pieces ? eventWps(p, pieces) : null;
  const dots = p.path.map((s, i) => {
    const n = ev ? ev.get(i) : i + 1;
    if (!n) return "";
    return `<circle cx="${f(s.x)}" cy="${f(s.y)}" r="2" fill="${V("db-ice", L.ice)}" stroke="${p.color}" stroke-width="0.5"/>`
      + `<text x="${f(s.x)}" y="${f(s.y) + 0.9}" font-size="2.6" font-weight="700" text-anchor="middle" fill="${p.color}">${n}</text>`;
  }).join("");
  return `${lines}${dots}`;
}

// puck flow lines. mode: "shot" solid dark · "rebound" dotted + distinct colour
// (so it reads apart from the shot it overlaps) · else dashed pass/rim/chip
const REBOUND_COLOR = "#e8892b";
const BLOCKED_COLOR = "#e01f2b";      // a rebound that can't reach its collector (thru a net)
// how far to hold each END (arrowhead) and START off its icon (net/player/point)
const CHAIN_TRIM = { shot: 4.6, rebound: 3, "rebound-x": 3, pass: 4 };
const CHAIN_START = { shot: 4, rebound: 3, "rebound-x": 3, pass: 4 };
// offset a polyline sideways by `o` feet (perpendicular to the local direction)
const offsetPoly = (pts, o) => pts.map((p, i) => {
  const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
  const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
  return { x: p.x - (dy / l) * o, y: p.y + (dx / l) * o };
});
const chainLine = (pts, mode) => {
  const rebound = mode === "rebound", blocked = mode === "rebound-x", shot = mode === "shot";
  const dotted = rebound || blocked;
  const color = blocked ? BLOCKED_COLOR : rebound ? REBOUND_COLOR : V("db-ice-ink", L["ice-ink"]);
  const line = trimLine(pts, CHAIN_START[mode] != null ? CHAIN_START[mode] : 3.5, CHAIN_TRIM[mode] != null ? CHAIN_TRIM[mode] : 3.5);
  if (shot) {
    // standard shot notation: two parallel lines + an open caret at the end
    // (the caret rides an invisible center line so it stays on-axis; the
    // visible lines stop at the caret's mouth so they never poke past it)
    const body = trimLine(line, 0, 2.2);
    const s = `fill="none" stroke="${color}" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"`;
    return `<polyline points="${polyPts(offsetPoly(body, 0.65))}" ${s}/>`
      + `<polyline points="${polyPts(offsetPoly(body, -0.65))}" ${s}/>`
      + `<polyline points="${polyPts(line)}" fill="none" stroke="${color}" stroke-opacity="0" stroke-width="0.72" marker-end="url(#arrowS)"/>`;
  }
  const dash = dotted ? ' stroke-dasharray="0.1 1.9"' : ' stroke-dasharray="2.4 2"';
  const marker = blocked ? "arrowRX" : rebound ? "arrowRB" : "arrowP";
  return `<polyline points="${polyPts(line)}" fill="none" stroke="${color}" stroke-width="${blocked ? 0.72 : 0.6}"`
    + `${dash} stroke-linecap="round" stroke-linejoin="round" opacity="0.9" marker-end="url(#${marker})"/>`;
};

function chain(pk, byId, pieces) {
  let cur = pk.carrier ? byId(pk.carrier) : (pk.pickup && byId(pk.pickup.to));
  if (!cur) return "";
  const nets = pieces.filter(q => q.kind === "net" || q.kind === "passer");
  const targets = pieces.filter(q => q.kind === "net" || q.kind === "passer" || q.kind === "bumper" || q.kind === "tire");
  const netSh = solidShapes(pieces);
  const shotNet = (launch, netId = pk.net) => {
    if (netId) { const n = targets.find(x => x.id === netId); if (n) return { x: n.x, y: n.y }; }  // this shot's own target
    if (nets.length) return nets.reduce((a, b) => (Math.hypot(b.x - launch.x, b.y - launch.y) < Math.hypot(a.x - launch.x, a.y - launch.y) ? b : a));
    return launch.x < 100 ? NET_L : NET_R;
  };
  const out = [];
  const rimPoly = (launch, aim, anchor) => (aim != null ? boards.rimTo(launch, aim, anchor) : boards.rimPath(launch, anchor));
  const transfers = pk.transfers || [];
  // the chain's unconditional END lives in terminals[] (ref="" = base chain;
  // ref'd terminals belong to branch conditions and aren't part of the base
  // plan). Legacy shotAt/rimAt/chipAt fields still win if present.
  const baseTerm = (pk.terminals || []).find(t => !t.ref) || null;
  const termAt = pk.shotAt != null ? pk.shotAt : pk.rimAt != null ? pk.rimAt : pk.chipAt != null ? pk.chipAt
    : baseTerm ? baseTerm.at : null;
  const lastAt = {};                                  // player id → route index where they last released
  // a give-and-go return: the receiver already carried the puck, so they catch
  // it a bit up their route from where they gave it (not at their final waypoint,
  // which is a later action) — this tracks what the animation actually does
  const returnPoint = (rec, giveAt, nextAt) => {
    const seg = Math.max(0, Math.min(giveAt + 1, nextAt, rec.path.length - 1));
    const prevPt = seg > 0 ? { x: rec.path[seg - 1].x, y: rec.path[seg - 1].y } : { x: rec.x, y: rec.y };
    return evalSeg(prevPt, rec.path[seg], 0.5);
  };
  transfers.forEach((tr, i) => {
    const rec = byId(tr.to); if (!rec) return;
    const launch = routePoint(cur, tr.at);
    const nextAt = transfers[i + 1] ? transfers[i + 1].at : (termAt != null ? termAt : rec.path.length - 1);
    const giveAt = lastAt[rec.id];
    const anchor = giveAt != null && tr.recvAt == null && tr.kind === "pass" && rec.path.length
      ? returnPoint(rec, giveAt, nextAt)
      : routePoint(rec, tr.recvAt == null ? rec.path.length - 1 : tr.recvAt);
    lastAt[cur.id] = tr.at;                            // the passer just released here
    if (tr.via) {                                      // give-and-go off a passer: in to it, back out
      const ps = byId(tr.via);
      const pPt = ps ? { x: ps.x, y: ps.y } : launch;
      out.push(chainLine([launch, pPt], "pass"), chainLine([pPt, anchor], "pass"));
    }
    else if (tr.kind === "shot") {
      const net = shotNet(launch, tr.net != null ? tr.net : null);
      // if the carom to the collector would pass through a net, it can't get
      // there — flag that rebound red instead of drawing it as a clean carom
      const rbMode = segCrossesNet(net, anchor, netSh) ? "rebound-x" : "rebound";
      out.push(chainLine([launch, net], "shot"), chainLine([net, anchor], rbMode));
    }
    else if (tr.kind === "rim") out.push(chainLine(rimPoly(launch, tr.aim, anchor), "pass"));
    else if (tr.kind === "chip") { const h = tr.aim != null ? aimVec(tr.aim) : heading(cur, tr.at); out.push(chainLine(boards.slideTo(launch.x, launch.y, h.x, h.y, anchor), "pass")); }
    else out.push(chainLine([launch, anchor], "pass"));   // pass
    cur = rec;
  });
  if (pk.shotAt != null) { const l = routePoint(cur, pk.shotAt); out.push(chainLine([l, shotNet(l)], "shot")); }
  else if (pk.rimAt != null) { const l = routePoint(cur, pk.rimAt); out.push(chainLine(boards.rimAround(l, pk.rimDist != null ? pk.rimDist : 65, pk.rimAim), "pass")); }
  else if (pk.chipAt != null) { const l = routePoint(cur, pk.chipAt); const h = pk.chipAim != null ? aimVec(pk.chipAim) : heading(cur, pk.chipAt); out.push(chainLine(boards.slide(l.x, l.y, h.x, h.y, pk.chipDist != null ? pk.chipDist : 26), "pass")); }
  else if (baseTerm) {
    const l = routePoint(cur, baseTerm.at);
    if (baseTerm.kind === "shot") out.push(chainLine([l, shotNet(l, baseTerm.net != null ? baseTerm.net : null)], "shot"));
    else if (baseTerm.kind === "rim") out.push(chainLine(boards.rimAround(l, baseTerm.dist != null ? baseTerm.dist : 65, baseTerm.aim), "pass"));
    else if (baseTerm.kind === "chip") { const h = baseTerm.aim != null ? aimVec(baseTerm.aim) : heading(cur, baseTerm.at); out.push(chainLine(boards.slide(l.x, l.y, h.x, h.y, baseTerm.dist != null ? baseTerm.dist : 26), "pass")); }
  }
  return out.join("");
}

/* ------------------------------------------------------------------ */
// rink view boxes (rink feet): the DSL RINK mode crops the diagram to half /
// quarter ice, matching the editor's views


function drillSvg(dsl, opts = {}) {
  const { pieces, rink: rinkMode } = parseDrill(dsl);
  const byId = id => pieces.find(p => p.id === id);
  const rank = k => (k === "net" || k === "bumper" || k === "deker" || k === "passer" || k === "tire" || k === "stick" || k === "mark" ? 0 : k === "player" ? 2 : 1);
  const defs = `<defs>
      <clipPath id="ice"><rect x="0.6" y="0.6" width="198.8" height="83.8" rx="28"/></clipPath>
      <marker id="arrowR" markerWidth="6" markerHeight="6" refX="4.4" refY="3" orient="auto"><path d="M0.4 0.6 L5 3 L0.4 5.4" fill="none" stroke="${V("db-ice-line-red", L["ice-line-red"])}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="arrowP" markerWidth="6" markerHeight="6" refX="4.4" refY="3" orient="auto"><path d="M0.4 0.6 L5 3 L0.4 5.4 Z" fill="${V("db-ice-ink", L["ice-ink"])}"/></marker>
      <marker id="arrowS" markerWidth="8" markerHeight="8" refX="5.6" refY="4" orient="auto"><path d="M1.4 1.9 L5.9 4 L1.4 6.1" fill="none" stroke="${V("db-ice-ink", L["ice-ink"])}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></marker>
      <marker id="arrowRB" markerWidth="6" markerHeight="6" refX="4.4" refY="3" orient="auto"><path d="M0.4 0.6 L5 3 L0.4 5.4 Z" fill="${REBOUND_COLOR}"/></marker>
      <marker id="arrowRX" markerWidth="6" markerHeight="6" refX="4.4" refY="3" orient="auto"><path d="M0.4 0.6 L5 3 L0.4 5.4 Z" fill="${BLOCKED_COLOR}"/></marker>
    </defs>`;
  // freehand ink (MARK) sits at the very bottom — directly on the ice, under
  // routes, puck lines, and every piece/tool
  const inks = pieces.filter(p => p.kind === "mark").map(p => piece(p)).join("");
  const routes = pieces.map(p => routePath(p, pieces)).join("");
  const chains = pieces.filter(p => p.kind === "puck").map(pk => chain(pk, byId, pieces)).join("");
  // a carried puck draws close to its player, not at its loose stored spot
  const drawPos = p => {
    if (p.kind !== "puck" || !p.carrier) return p;
    const c = byId(p.carrier); if (!c) return p;
    const dx = p.x - c.x, dy = p.y - c.y, dd = Math.hypot(dx, dy) || 1, off = 4.2;
    return { ...p, x: c.x + dx / dd * off, y: c.y + dy / dd * off };
  };
  const icons = [...pieces].filter(p => p.kind !== "mark").sort((a, b) => rank(a.kind) - rank(b.kind)).map(p => piece(drawPos(p))).join("");
  // text labels paint on top: standalone label pieces + "label"-mode waypoints
  const labels = pieces.filter(p => p.kind === "label").map(p => labelSvg(p.x, p.y, p.text, p.size, p.color, p)).join("")
    + pieces.flatMap(p => (p.path || []).filter(s => s.dmode === "label" && s.desc)
        .map(s => labelSvg(s.x + (s.dox || 0), s.y + (s.doy != null ? s.doy : -5), s.desc, s.dsize, "#14202b"))).join("");
  const wattr = opts.width ? ` width="${opts.width}"` : "";
  // crop to the drill's rink mode (full / half / quarter). Pad preserves the
  // view's aspect ratio (full ice = 200:85) so the exported image keeps true ice
  // proportions: a 7 ft vertical margin, horizontal margin scaled to match.
  const [vx, vy, vw, vh] = VIEWS[rinkMode] || VIEWS.full;
  const py = 7, px = (vw / vh) * py;
  const viewBox = `${vx - px} ${vy - py} ${vw + 2 * px} ${vh + 2 * py}`;
  // icons paint over the chain lines; arrowheads are trimmed back so they point
  // at their target instead of vanishing under a circle. Labels stay on top.
  return `<svg class="rink" viewBox="${viewBox}"${wattr} xmlns="http://www.w3.org/2000/svg" role="img">${defs}${rink()}${inks}${routes}${chains}${icons}${labels}</svg>`;
}

(function(){
  var ta=document.getElementById('dsl'),dia=document.getElementById('diagram'),err=document.getElementById('err'),
      title=document.getElementById('title'),lede=document.getElementById('lede'),leg=document.getElementById('legend'),meta=document.getElementById('meta'),
      copy=document.getElementById('copy'),printBtn=document.getElementById('print'),
      notesEl=document.getElementById('notes'),notesSec=document.getElementById('notes-sec'),
      invEl=document.getElementById('inventory'),invSec=document.getElementById('inv-sec'),
      stepsEl=document.getElementById('steps'),stepsSec=document.getElementById('steps-sec');
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  // URL-safe base64 of UTF-8 text, for sharing the current drill in the link.
  function enc(s){try{return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return '';}}
  function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');return decodeURIComponent(escape(atob(s)));}catch(e){return null;}}
  function syncHash(){ try{ history.replaceState(null,'','#d='+enc(ta.value)); }catch(e){} }
  function render(){
    var dsl=extractDrill(ta.value),r;
    try{ r=parseDrill(dsl); dia.innerHTML=drillSvg(dsl); }
    catch(e){ err.textContent=String(e&&e.message||e); return; }
    err.textContent=r.errors.length?r.errors.join('  \u00b7  '):'';
    title.textContent=r.title||'Drill'; lede.textContent=r.desc||'';
    var players=r.pieces.filter(function(p){return p.kind==='player';});
    var L=players.map(function(p){return '<span><span class="dot" style="background:'+p.color+'"></span>'+esc(p.id)+(p.defense?' \u2014 auto-D':'')+'</span>';});
    r.pieces.filter(function(p){return p.kind==='net';}).forEach(function(p){L.push('<span><span class="dot" style="background:'+(p.goalie?'#2f9e57':p.color)+'"></span>'+esc(p.id)+(p.goalie?' \u2014 net + goalie':' \u2014 net')+'</span>');});
    L.push('<span><span class="solid"></span>skating route</span>','<span><span class="dash"></span>puck path</span>');
    leg.innerHTML=L.join('');
    meta.textContent=players.length+' skater'+(players.length===1?'':'s')+' \u00b7 live';
    // coaching notes (markdown)
    if(r.notes&&r.notes.trim()){ notesEl.innerHTML=mdBlock(r.notes); notesSec.hidden=false; } else { notesEl.innerHTML=''; notesSec.hidden=true; }
    // inventory / recipe table
    var rows=deriveInventory(r.pieces,r.items).filter(function(x){return !x.hide;});
    if(rows.length){
      invEl.innerHTML='<table class="inv"><thead><tr><th>Item</th><th>Qty</th></tr></thead><tbody>'+
        rows.map(function(x){return '<tr><td>'+esc(x.label)+'</td><td>'+x.count+'</td></tr>';}).join('')+'</tbody></table>';
      invSec.hidden=false;
    } else { invEl.innerHTML=''; invSec.hidden=true; }
    // authored presentation steps → numbered list (markdown inline)
    var st=(r.steps||[]).filter(function(s){return (s.text||'').trim();});
    if(st.length){ stepsEl.innerHTML='<ol class="steps">'+st.map(function(s){return '<li>'+mdInline(esc(s.text))+'</li>';}).join('')+'</ol>'; stepsSec.hidden=false; }
    else { stepsEl.innerHTML=''; stepsSec.hidden=true; }
    syncHash();
  }
  // A shared link carries the drill in #d=… — prefer it over the built-in default.
  if(location.hash.indexOf('#d=')===0){ var d=dec(location.hash.slice(3)); if(d!=null) ta.value=d; }
  function fallbackCopy(text){ var t=document.createElement('textarea'); t.value=text; t.setAttribute('readonly',''); t.style.position='fixed'; t.style.top='-1000px'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); }
  copy.addEventListener('click',function(){
    syncHash();
    var url=location.href, lbl=copy.querySelector('.lbl');
    function done(){ copy.classList.add('done'); lbl.textContent='Link copied'; setTimeout(function(){ copy.classList.remove('done'); lbl.textContent='Copy link'; },1600); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){ fallbackCopy(url); done(); }); }
    else { fallbackCopy(url); done(); }
  });
  printBtn.addEventListener('click',function(){ window.print(); });
  ta.addEventListener('input',render); render();
})();
</script>
