TITLE Chip Off the Boards, Behind the D
DESC F1 banks a chip off the boards past the standing-up D and picks it up behind him in the neutral zone.
NOTES
| ## Coaching points
|
| A **delayed** neutral-zone entry that beats a standing-up D with a chip.
|
| 1. F1 carries hard up the wall to draw the D up.
| 2. **Chip** off the glass past the D (aim `~-60`).
| 3. Slip inside and re-gather behind him — still onside.
|
| - Cue: *sell the carry* before the chip.
| - Reps: 3 each side, then add a backchecker.
END NOTES
PIECE N2 net 183 42.5 face=180 goalie
PIECE D1 player 110 20 #1f4fa3 D1 defense
PIECE F1 player 46 26 F1
PATH F1 L 80,14 DESC "Chip off glass" SHOW label OFF -22,16 L 100,12 DESC "Pickup behind D" SHOW label OFF 8,13 L 120,26
PIECE L1 label 100 73 "Neutral-zone regroup"
PIECE PK1 puck 46 26 on=F1 chip=2:F1@3~-60
STEP at=0 "**F1** carries hard up the wall"
STEP on=F1:2 "Chip off the glass past the D — `~-60`"
ITEM puck count=8
ITEM whistle count=1 "Whistle"</textarea>

<script>
const VIEWS = { full:[0,0,200,85], half:[100,0,100,85], quarter:[100,0,100,42.5] };
const RINK = { W:200, H:85 };
const DSL_VERSION = 9;

// Rink boards: a rounded-rectangle boundary the puck can rim along or bounce
// off. Coordinates are rink feet (x 0..200, y 0..85). The puck-center boundary
// is inset slightly from the painted board line so the puck rides the boards.

const X0 = 2.5, X1 = 197.5, Y0 = 2.5, Y1 = 82.5, R = 23;
const cxL = X0 + R, cxR = X1 - R, cyT = Y0 + R, cyB = Y1 - R;
const HALF = Math.PI / 2;
const W = cxR - cxL, H = cyB - cyT, A = HALF * R;
const PERIM = 2 * W + 2 * H + 4 * A;

// perimeter, clockwise from the top-left tangent point
const S = [];
let acc = 0;
const line = (ax, ay, ux, uy, len) => { S.push({ s0: acc, len, kind: "line", ax, ay, ux, uy }); acc += len; };
const arc = (cx, cy, a0) => { S.push({ s0: acc, len: A, kind: "arc", cx, cy, a0 }); acc += A; };
line(cxL, Y0, 1, 0, W);      // top
arc(cxR, cyT, -HALF);        // top-right corner
line(X1, cyT, 0, 1, H);      // right
arc(cxR, cyB, 0);            // bottom-right
line(cxR, Y1, -1, 0, W);     // bottom
arc(cxL, cyB, HALF);         // bottom-left
line(X0, cyB, 0, -1, H);     // left
arc(cxL, cyT, Math.PI);      // top-left

function isInside(x, y) {
  if (x < X0 || x > X1 || y < Y0 || y > Y1) return false;
  if (x < cxL && y < cyT) return Math.hypot(x - cxL, y - cyT) <= R;
  if (x > cxR && y < cyT) return Math.hypot(x - cxR, y - cyT) <= R;
  if (x > cxR && y > cyB) return Math.hypot(x - cxR, y - cyB) <= R;
  if (x < cxL && y > cyB) return Math.hypot(x - cxL, y - cyB) <= R;
  return true;
}

// nearest boundary point + inward unit normal
function nearest(x, y) {
  let cx = null, cy = null;
  if (x < cxL && y < cyT) { cx = cxL; cy = cyT; }
  else if (x > cxR && y < cyT) { cx = cxR; cy = cyT; }
  else if (x > cxR && y > cyB) { cx = cxR; cy = cyB; }
  else if (x < cxL && y > cyB) { cx = cxL; cy = cyB; }
  if (cx != null) {
    const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1;
    return { x: cx + (dx / d) * R, y: cy + (dy / d) * R, nx: -dx / d, ny: -dy / d };
  }
  const dTop = y - Y0, dBot = Y1 - y, dLeft = x - X0, dRight = X1 - x;
  const m = Math.min(dTop, dBot, dLeft, dRight);
  if (m === dTop) return { x, y: Y0, nx: 0, ny: 1 };
  if (m === dBot) return { x, y: Y1, nx: 0, ny: -1 };
  if (m === dLeft) return { x: X0, y, nx: 1, ny: 0 };
  return { x: X1, y, nx: -1, ny: 0 };
}

function clampInside(x, y) {
  if (isInside(x, y)) return { x, y };
  const n = nearest(x, y);
  return { x: n.x, y: n.y };
}

// keep a moving puck inside the boards, reflecting its velocity off them
function contain(x, y, vx, vy, restitution = 0.7) {
  if (isInside(x, y)) return { x, y, vx, vy, hit: false };
  const n = nearest(x, y);
  const dot = vx * n.nx + vy * n.ny;                 // n is the inward normal
  if (dot < 0) { vx = (vx - 2 * dot * n.nx) * restitution; vy = (vy - 2 * dot * n.ny) * restitution; }
  return { x: n.x, y: n.y, vx, vy, hit: true };
}

// unit tangent along the boards near a point, pointing toward `toward`
function tangentToward(from, toward) {
  const s = project(from).s;
  const a = pointAt(s + 3), b = pointAt(s - 3);
  const pick = Math.hypot(a.x - toward.x, a.y - toward.y) < Math.hypot(b.x - toward.x, b.y - toward.y) ? a : b;
  const dx = pick.x - from.x, dy = pick.y - from.y, m = Math.hypot(dx, dy) || 1;
  return { x: dx / m, y: dy / m };
}

// distance from a point to the nearest board
const edgeDist = (x, y) => { const p = project({ x, y }); return Math.hypot(p.x - x, p.y - y); };

function pointAt(s) {
  s = ((s % PERIM) + PERIM) % PERIM;
  for (const g of S) {
    if (s <= g.s0 + g.len + 1e-9) {
      const local = s - g.s0;
      if (g.kind === "line") return { x: g.ax + g.ux * local, y: g.ay + g.uy * local };
      const ang = g.a0 + (local / g.len) * HALF;
      return { x: g.cx + Math.cos(ang) * R, y: g.cy + Math.sin(ang) * R };

}

// Trim a small gap off the START of a segment for DRAWING only (the ref path and
// timing still use the full segment). Returns { from, seg } — the sub-segment
// beginning `gap` feet from the original start — or null if the segment ends
// within the gap. Used so a route line starts just clear of the player icon.
function trimSegStart(from, s, gap, ar = 1) {
  const sar = Math.sqrt(ar);                 // geometric-mean metric: gaps read the same
  const gm = (ax, ay, bx, by) => Math.hypot((bx - ax) * sar, (by - ay) / sar);
  const N = 64;
  let pT = 0, pD = 0;
  for (let i = 1; i <= N; i++) {
    const t = i / N, pt = evalSeg(from, s, t);
    const d = gm(from.x, from.y, pt.x, pt.y);
    if (d >= gap) {                          // interpolate the crossing for a gap-accurate cut
      const f = Math.max(0, Math.min(1, (gap - pD) / (d - pD || 1)));
      const [first, second] = splitSeg(from, s, pT + (t - pT) * f);
      return { from: { x: first.x, y: first.y }, seg: second };
    }
    pT = t; pD = d;
  }
  return null;                               // whole segment sits within the gap
}

// Trim a gap off the END of a segment for drawing (mirror of trimSegStart) —
// leaves the leg stopping `gap` feet short of its endpoint. Returns { seg } or null.
function trimSegEnd(from, s, gap, ar = 1) {
  const sar = Math.sqrt(ar);
  const gm = (ax, ay, bx, by) => Math.hypot((bx - ax) * sar, (by - ay) / sar);
  const end = { x: s.x, y: s.y };
  const N = 64;
  let pT = 1, pD = 0;
  for (let i = N - 1; i >= 0; i--) {
    const t = i / N, pt = evalSeg(from, s, t);
    const d = gm(end.x, end.y, pt.x, pt.y);
    if (d >= gap) {
      const f = Math.max(0, Math.min(1, (gap - pD) / (d - pD || 1)));
      const [first] = splitSeg(from, s, pT + (t - pT) * f);
      return { seg: first };
    }
    pT = t; pD = d;
  }
  return null;                               // whole segment sits within the gap
}

// Drop a `gap`-foot lead off the start of a polyline (the net-detour case),
// interpolating the exact cut point. Returns a new points array.
function trimPolyStart(pts, gap, ar = 1) {
  if (!pts || pts.length < 2) return pts;
  const sar = Math.sqrt(ar);
  const gm = (ax, ay, bx, by) => Math.hypot((bx - ax) * sar, (by - ay) / sar);
  const start = pts[0];
  for (let i = 1; i < pts.length; i++) {
    if (gm(start.x, start.y, pts[i].x, pts[i].y) >= gap) {
      const a = pts[i - 1], b = pts[i];
      const segLen = gm(a.x, a.y, b.x, b.y) || 1;
      const f = Math.max(0, Math.min(1, (gap - gm(start.x, start.y, a.x, a.y)) / segLen));
      return [{ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }, ...pts.slice(i)];
    }
  }
  return pts;                                // whole polyline within the gap
}

// Cut radius-`gap` holes (gm metric, like trimPolyStart) around each of
// `centers` out of a polyline, interpolating the exact entry/exit crossings.
// Returns an array of sub-polylines (each ≥ 2 pts); [] when everything falls
// inside the holes. The detour-polyline counterpart of the authored routes'
// trimSegStart/trimSegEnd action-badge gaps: min-distance over centers makes
// overlapping holes union for free (a sliver between two close badges vanishes).
function gapPolyAt(pts, centers, gap, ar = 1) {
  if (!pts || pts.length < 2 || !centers || !centers.length) return pts && pts.length >= 2 ? [pts] : [];
  const sar = Math.sqrt(ar);
  const gm = (ax, ay, bx, by) => Math.hypot((bx - ax) * sar, (by - ay) / sar);
  const dist = p => { let m = Infinity; for (const c of centers) { const d = gm(c.x, c.y, p.x, p.y); if (d < m) m = d; } return m; };
  const subs = [];
  let run = [];
  const close = () => { if (run.length >= 2) subs.push(run); run = []; };
  let dPrev = dist(pts[0]);
  if (dPrev >= gap) run.push(pts[0]);
  for (let i = 1; i < pts.length; i++) {
    const d = dist(pts[i]);
    const a = pts[i - 1], b = pts[i];
    if (dPrev >= gap && d < gap) {           // outside → inside: cut at the crossing
      const f = Math.max(0, Math.min(1, (gap - dPrev) / (d - dPrev || 1)));
      run.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
      close();
    } else if (dPrev < gap && d >= gap) {    // inside → outside: resume at the crossing
      const f = Math.max(0, Math.min(1, (gap - dPrev) / (d - dPrev || 1)));
      run.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
      run.push(b);
    } else if (d >= gap) run.push(b);
    dPrev = d;
  }
  close();
  return subs;
}

// Drop a `gap`-foot tail off the END of a polyline (mirror of trimPolyStart),
// interpolating the exact cut point. Returns a new points array.
function trimPolyEnd(pts, gap, ar = 1) {
  if (!pts || pts.length < 2) return pts;
  const sar = Math.sqrt(ar);
  const gm = (ax, ay, bx, by) => Math.hypot((bx - ax) * sar, (by - ay) / sar);
  const end = pts[pts.length - 1];
  for (let i = pts.length - 2; i >= 0; i--) {
    if (gm(end.x, end.y, pts[i].x, pts[i].y) >= gap) {
      const a = pts[i], b = pts[i + 1];
      const segLen = gm(a.x, a.y, b.x, b.y) || 1;
      const f = Math.max(0, Math.min(1, (gap - gm(end.x, end.y, b.x, b.y)) / segLen));
      return [...pts.slice(0, i + 1), { x: b.x + (a.x - b.x) * f, y: b.y + (a.y - b.y) * f }];
    }
  }
  return pts;                                // whole polyline within the gap
}

/* ---- waypoint "join" (Illustrator-style point types) ----
   A waypoint's two bézier handles are stored on two different segments: the
   INCOMING handle is the control of the leg ENDING at the waypoint (c2 for a
   cubic, cx for a quad), the OUTGOING handle is the control of the NEXT leg
   nearest its start (c1 / cx). A `join` flag on the ending segment says how the
   two are linked while editing: "corner" (default, independent), "smooth"
   (kept collinear, each side keeps its own length) or "sym" (collinear + equal
   length). It never affects the rendered/serialized curve — only re-editing. */

// The two handle controls flanking waypoint w. Each side is {i, xk, yk} (the
// segment index + the x/y field names) or null when that side is a straight leg.
function jointControls(path, w) {
  const s = path[w];
  if (!s) return null;
  const inH = s.type === "C" ? { i: w, xk: "c2x", yk: "c2y" }
            : s.type === "Q" ? { i: w, xk: "cx", yk: "cy" } : null;
  const nx = path[w + 1];
  const outH = !nx ? null
    : nx.type === "C" ? { i: w + 1, xk: "c1x", yk: "c1y" }
    : nx.type === "Q" ? { i: w + 1, xk: "cx", yk: "cy" } : null;
  return { A: { x: s.x, y: s.y }, inH, outH };
}

// While dragging one handle of a linked waypoint, drive the OPPOSITE handle so
// the join stays smooth/symmetric. `draggedSeg`/`draggedKind` identify the grabbed
// control (kind ∈ c1|c2|q); `cp` is its new position. Returns a new path (or the
// same one when there's nothing to mirror — corner points, endpoints, the route's
// departure handle, or a straight neighbour).
function mirrorJoint(path, w, draggedSeg, draggedKind, cp) {
  const s = path[w];
  if (!s) return path;
  const join = s.join || "corner";
  if (join === "corner") return path;
  const jc = jointControls(path, w);
  if (!jc || !jc.inH || !jc.outH) return path;
  const inKind = s.type === "C" ? "c2" : "q";
  const outKind = path[w + 1].type === "C" ? "c1" : "q";
  const draggedIn = draggedSeg === jc.inH.i && draggedKind === inKind;
  const draggedOut = draggedSeg === jc.outH.i && draggedKind === outKind;
  if (!draggedIn && !draggedOut) return path;    // e.g. the origin's departure handle
  const opp = draggedIn ? jc.outH : jc.inH;
  const A = jc.A;
  const vx = cp.x - A.x, vy = cp.y - A.y, vl = Math.hypot(vx, vy);
  if (vl < 1e-3) return path;
  const oldOpp = { x: path[opp.i][opp.xk], y: path[opp.i][opp.yk] };
  let nx, ny;
  if (join === "sym") { nx = A.x - vx; ny = A.y - vy; }
  else { const ol = Math.hypot(oldOpp.x - A.x, oldOpp.y - A.y) || vl; nx = A.x - (vx / vl) * ol; ny = A.y - (vy / vl) * ol; }
  const out = path.slice();
  out[opp.i] = { ...out[opp.i], [opp.xk]: clampX(nx), [opp.yk]: clampY(ny) };
  return out;
}

// A linked waypoint carries its two handles as its anchor moves (rigid drag).
function translateJointHandles(path, w, dx, dy) {
  const jc = jointControls(path, w);
  if (!jc) return path;
  const out = path.slice();
  for (const h of [jc.inH, jc.outH]) {
    if (!h) continue;
    out[h.i] = { ...out[h.i], [h.xk]: clampX(out[h.i][h.xk] + dx), [h.yk]: clampY(out[h.i][h.yk] + dy) };
  }
  return out;
}

// Set waypoint w's join type, re-flowing its handles onto a shared tangent so the
// change is visible immediately (smooth keeps each handle's length; sym averages
// them). `origin` is the route start, used only for the w===0 fallback tangent.
// A one-sided junction (a straight neighbour) just records the flag. Returns a
// new path; "corner" clears the flag and leaves the handles untouched.
function alignJoint(path, w, join, origin) {
  const out = path.slice();
  if (!out[w]) return out;
  if (join === "corner") { const s = { ...out[w] }; delete s.join; out[w] = s; return out; }
  const jc = jointControls(out, w);
  if (!jc || !jc.inH || !jc.outH) { out[w] = { ...out[w], join }; return out; }
  const A = jc.A;
  const inP = { x: out[jc.inH.i][jc.inH.xk], y: out[jc.inH.i][jc.inH.yk] };
  const outP = { x: out[jc.outH.i][jc.outH.xk], y: out[jc.outH.i][jc.outH.yk] };
  let tx = outP.x - inP.x, ty = outP.y - inP.y;
  if (Math.hypot(tx, ty) < 1e-3) {          // handles coincide — fall back to the neighbour chord
    const prev = w >= 1 ? { x: out[w - 1].x, y: out[w - 1].y } : origin;
    tx = out[w + 1].x - prev.x; ty = out[w + 1].y - prev.y;
  }
  const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
  let inLen = Math.hypot(inP.x - A.x, inP.y - A.y);
  let outLen = Math.hypot(outP.x - A.x, outP.y - A.y);
  if (join === "sym") { const m = (inLen + outLen) / 2 || 8; inLen = m; outLen = m; }
  else { if (inLen < 1e-3) inLen = 8; if (outLen < 1e-3) outLen = 8; }
  const setH = (h, px, py) => { out[h.i] = { ...out[h.i], [h.xk]: clampX(px), [h.yk]: clampY(py) }; };
  setH(jc.inH, A.x - tx * inLen, A.y - ty * inLen);    // in-handle points back up the incoming leg
  setH(jc.outH, A.x + tx * outLen, A.y + ty * outLen); // out-handle continues down the next leg
  out[w] = { ...out[w], join };
  return out;
}

/* ---- finger drawing ---- */

function rdp(pts, eps) {
  if (pts.length < 3) return pts.slice();
  const [a, b] = [pts[0], pts[pts.length - 1]];
  let maxD = 0, idx = 0;
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1e-9;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = Math.abs(dy * pts[i].x - dx * pts[i].y + b.x * a.y - b.y * a.x) / len;
    if (d > maxD) { maxD = d; idx = i; }
  }
  if (maxD <= eps) return [a, b];
  return [...rdp(pts.slice(0, idx + 1), eps).slice(0, -1), ...rdp(pts.slice(idx), eps)];
}

function catmullToBezier(pts) {
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    segs.push({
      type: "C", mode: "carry", dir: "fwd", stop: 0, rate: 1,
      c1x: clampX(p1.x + (p2.x - p0.x) / 6), c1y: clampY(p1.y + (p2.y - p0.y) / 6),
      c2x: clampX(p2.x - (p3.x - p1.x) / 6), c2y: clampY(p2.y - (p3.y - p1.y) / 6),
      x: p2.x, y: p2.y,
    });
  }
  return segs;
}

function fitRoute(start, raw) {
  const pts = [start];
  raw.forEach(q => {
    const last = pts[pts.length - 1];
    if (Math.hypot(q.x - last.x, q.y - last.y) > 2.2) pts.push(q);
  });
  if (pts.length < 2) return [];
  const simp = pts.length > 3 ? [pts[0], ...rdp(pts.slice(1), 1.6)] : pts;
  const chain = simp.filter((q, i) => i === 0 || Math.hypot(q.x - simp[i - 1].x, q.y - simp[i - 1].y) > 1.5);
  if (chain.length < 2) return [];
  if (chain.length === 2)
    return [{ type: "L", mode: "carry", dir: "fwd", stop: 0, rate: 1, x: chain[1].x, y: chain[1].y }];
  return catmullToBezier(chain);
}



// Nets as solid obstacles. A net's footprint (rink feet) is the cage polygon;
// the MOUTH (front) is open so pucks enter from the front, while the sides and
// back are solid — pucks bounce off them and players route around the whole net.
// Icon units → rink feet uses ICON_SCALE (0.8); coords match icons.jsx.

const ICON = 0.8;
// cage outline in icon units, mouth-top → around the back → mouth-bottom
const LOCAL = [
  [0, -3.75], [-1.7, -3.75], [-3.45, -3.1], [-4.15, -1.5],
  [-4.15, 1.5], [-3.45, 3.1], [-1.7, 3.75], [0, 3.75],
];

// world-space shape for one net piece (+ world↔local transforms)
function netShape(n) {
  const s = (n.size || 1) * ICON;
  const a = ((n.facing || 0) * Math.PI) / 180, c = Math.cos(a), si = Math.sin(a);
  const toWorld = (lx, ly) => ({ x: n.x + lx * s * c - ly * s * si, y: n.y + lx * s * si + ly * s * c });
  const toLocal = (x, y) => { const dx = x - n.x, dy = y - n.y; return { lx: (dx * c + dy * si) / s, ly: (-dx * si + dy * c) / s }; };
  const pts = LOCAL.map(([lx, ly]) => toWorld(lx, ly));
  // solid edges = consecutive pts[0..7]; the mouth edge pts[7]→pts[0] is open
  const solid = [];
  for (let i = 0; i < pts.length - 1; i++) solid.push([pts[i], pts[i + 1]]);
  // a keep-out disc (centroid + radius) that players arc smoothly around
  let cx = 0, cy = 0; for (const p of pts) { cx += p.x; cy += p.y; } cx /= pts.length; cy /= pts.length;
  let r = 0; for (const p of pts) r = Math.max(r, Math.hypot(p.x - cx, p.y - cy));
  return { pts, solid, mouth: [pts[pts.length - 1], pts[0]], toWorld, toLocal, s, cx, cy, r };
}

function netShapes(pieces) {
  return (pieces || []).filter(p => p.kind === "net").map(netShape);
}

// A bumper is a solid rectangular barrier: all four edges are solid (no open
// mouth), so pucks carom off any side and players route around the whole bar.
// It's long along its local x; its faces' normal is perpendicular to `facing`.
const BUMP_HALF_L = 7.7 * ICON;   // half-length, along the bar
const BUMP_HALF_T = 1.55 * ICON;  // half-thickness (a touch proud for the puck radius)
function bumperShape(b) {
  const a = ((b.facing || 0) * Math.PI) / 180, c = Math.cos(a), si = Math.sin(a);
  const toWorld = (lx, ly) => ({ x: b.x + lx * c - ly * si, y: b.y + lx * si + ly * c });
  const corners = [[-BUMP_HALF_L, -BUMP_HALF_T], [BUMP_HALF_L, -BUMP_HALF_T], [BUMP_HALF_L, BUMP_HALF_T], [-BUMP_HALF_L, BUMP_HALF_T]];
  const pts = corners.map(([lx, ly]) => toWorld(lx, ly));
  const solid = [];
  for (let i = 0; i < pts.length; i++) solid.push([pts[i], pts[(i + 1) % pts.length]]); // closed loop — every edge solid
  const r = Math.hypot(BUMP_HALF_L, BUMP_HALF_T);
  // capsule spine (the two ends along the long axis) for player route avoidance
  const spine = [toWorld(-BUMP_HALF_L, 0), toWorld(BUMP_HALF_L, 0)];
  return { pts, solid, mouth: null, cx: b.x, cy: b.y, r, spine, capR: BUMP_HALF_T, bumper: true };
}

function bumperShapes(pieces) {
  return (pieces || []).filter(p => p.kind === "bumper").map(bumperShape);
}

// every solid puck obstacle (nets + bumpers) — pucks carom off these
function solidShapes(pieces) {
  return [...netShapes(pieces), ...bumperShapes(pieces)];
}

// point-in-polygon (cage closed by the mouth)
function inNet(sh, x, y) {
  const p = sh.pts; let inside = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const xi = p[i].x, yi = p[i].y, xj = p[j].x, yj = p[j].y;
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// nearest point on a segment to (x,y)
function nearestOnSeg(a, b, x, y) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1;
  let t = ((x - a.x) * dx + (y - a.y) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return { x: a.x + dx * t, y: a.y + dy * t, dx, dy };
}

// Slide a point out the nearer SIDE of a net (in the net's local frame), with
// the clearance ramped smoothly over a buffer in front of and behind the cage so
// the detour rounds into an ARC (no sharp V) — and only the net footprint itself
// pushes hard, so a player placed behind the net isn't disturbed. margin (feet).
function avoidNets(shapes, x, y, margin = 1.1) {
  for (const sh of shapes) {
    const { lx, ly } = sh.toLocal(x, y);       // lx: 0 mouth → -4.15 back
    const front = 0, back = -4.15, buf = 2.6;
    if (lx > front + buf || lx < back - buf) continue;
    // depth factor: 1 across the cage, easing to 0 over the front/back buffers
    let f = lx <= front && lx >= back ? 1 : lx > front ? 1 - (lx - front) / buf : 1 - (back - lx) / buf;
    f = Math.max(0, Math.min(1, f));
    f = f * f * (3 - 2 * f);                    // smoothstep → rounded shoulders
    const bound = (3.75 + margin / sh.s) * f;   // lateral clearance at this depth
    if (Math.abs(ly) >= bound) continue;
    const w = sh.toWorld(lx, (ly >= 0 ? 1 : -1) * bound);
    x = w.x; y = w.y;
  }
  return { x, y };
}

// Reroute a sampled polyline so it arcs smoothly AROUND each net's keep-out disc
// instead of cutting through it — a single tangent-in → boundary-arc → tangent-out
// per net, so there's no per-point jitter. Endpoints (incl. a start/end placed
// inside the disc, e.g. behind the net) are preserved.
function detourRoute(points, shapes) {
  let pts = points, changed = false;
  for (const sh of shapes) { const np = aroundDisc(pts, sh.cx, sh.cy, sh.r + 1); if (np !== pts) { pts = np; changed = true; } }
  return changed ? chaikin(chaikin(pts)) : points;   // round the tangent/radial joins
}
// Chaikin corner-cutting (endpoints fixed) — rounds any residual joins
function chaikin(pts) {
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (Math.hypot(b.x - a.x, b.y - a.y) < 1e-6) continue;
    out.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25 });
    out.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75 });
  }
  out.push(pts[pts.length - 1]);
  return out;
}

function segCircleHit(a, b, cx, cy, R) {
  const dx = b.x - a.x, dy = b.y - a.y, fx = a.x - cx, fy = a.y - cy;
  const A = dx * dx + dy * dy, B = 2 * (fx * dx + fy * dy), C = fx * fx + fy * fy - R * R;
  let dis = B * B - 4 * A * C;
  if (dis < 0) return { x: b.x, y: b.y };
  dis = Math.sqrt(dis);
  const t = Math.max(0, Math.min(1, (-B - dis) / (2 * A)));
  return { x: a.x + dx * t, y: a.y + dy * t };
}
// the two tangent points from an external point P to a circle
function tangents(P, cx, cy, R) {
  const dx = P.x - cx, dy = P.y - cy, d = Math.hypot(dx, dy);
  if (d <= R + 1e-6) return [];
  const base = Math.atan2(dy, dx), off = Math.acos(Math.max(-1, Math.min(1, R / d)));
  return [base + off, base - off].map(a => ({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, ang: a }));
}
function arcPts(cx, cy, R, a0, ccw, span) {
  const n = Math.max(4, Math.round(span / 0.12)), out = [];
  for (let k = 0; k <= n; k++) { const a = a0 + (ccw ? 1 : -1) * span * k / n; out.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R }); }
  return out;
}

function aroundDisc(pts, cx, cy, R) {
  const D = p => Math.hypot(p.x - cx, p.y - cy);
  let i0 = -1, i1 = -1;
  for (let i = 0; i < pts.length; i++) if (D(pts[i]) < R) { if (i0 < 0) i0 = i; i1 = i; }
  if (i0 < 0) return pts;                                    // never enters the disc
  // anchor the tangents well outside the disc (~2.4R) so the route eases in
  // gradually instead of turning hard right at the edge
  const AR = 2.4 * R;
  let ai = i0; while (ai > 0 && D(pts[ai - 1]) < AR) ai--;
  let bi = i1; while (bi < pts.length - 1 && D(pts[bi + 1]) < AR) bi++;
  ai = Math.max(0, ai - 1); bi = Math.min(pts.length - 1, bi + 1);
  const A = pts[ai], B = pts[bi];
  const startInside = D(A) < R, endInside = D(B) < R;
  const ang = p => Math.atan2(p.y - cy, p.x - cx);

  // Prefer a tangent-in → arc → tangent-out path (smooth, no kink at the joins).
  // If an endpoint is inside the disc, that side starts/ends radially instead.
  const TA = startInside ? null : tangents(A, cx, cy, R);
  const TB = endInside ? null : tangents(B, cx, cy, R);
  const startAngs = TA ? TA : [{ ...segCircleHitProj(pts[0], cx, cy, R), fromInside: true }];
  const endAngs = TB ? TB : [{ ...segCircleHitProj(pts[pts.length - 1], cx, cy, R), fromInside: true }];

  let best = null;
  for (const t1 of startAngs) for (const t2 of endAngs) {
    // arc direction follows the A→t1 tangent (radial-out if the start is inside)
    const inx = t1.x - A.x, iny = t1.y - A.y;
    const ccwTan1 = { x: -Math.sin(t1.ang), y: Math.cos(t1.ang) };
    const ccw = t1.fromInside
      ? (-Math.sin(t1.ang) * (B.x - A.x) + Math.cos(t1.ang) * (B.y - A.y)) >= 0
      : (inx * ccwTan1.x + iny * ccwTan1.y) >= 0;
    // require the arc to LEAVE at t2 heading toward B (tangency) unless B is inside
    const exitTan = ccw ? { x: -Math.sin(t2.ang), y: Math.cos(t2.ang) } : { x: Math.sin(t2.ang), y: -Math.cos(t2.ang) };
    const outx = B.x - t2.x, outy = B.y - t2.y;
    if (!t2.fromInside && exitTan.x * outx + exitTan.y * outy < 0) continue;
    let span = ccw ? t2.ang - t1.ang : t1.ang - t2.ang;
    while (span < 0) span += 2 * Math.PI;
    if (span > Math.PI * 1.7) continue;                     // reject wrong-way near-full loops
    const len = Math.hypot(inx, iny) + span * R + Math.hypot(outx, outy);
    if (!best || len < best.len) best = { t1, t2, ccw, span, len };
  }
  if (!best) return pts;
  const arc = arcPts(cx, cy, R, best.t1.ang, best.ccw, best.span);   // includes t1 & t2 as endpoints
  const pre = startInside ? [pts[0]] : pts.slice(0, ai + 1);
  const post = endInside ? [pts[pts.length - 1]] : pts.slice(bi);
  return [...pre, ...arc, ...post];
}
// project a point radially onto the circle (for an endpoint inside the disc)
function segCircleHitProj(p, cx, cy, R) {
  const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
  const ang = Math.atan2(dy, dx);
  return { x: cx + Math.cos(ang) * R, y: cy + Math.sin(ang) * R, ang };
}

// does segment a→b cross any net's solid cage (sides/back)? Used to flag a
// rebound whose collection spot sits behind/through a net — it can't get there.
function segCrossesNet(a, b, shapes) {
  for (const sh of shapes || []) for (const [c, d] of sh.solid) if (segInt(a, b, c, d)) return true;
  return false;
}

// segment a→b vs segment c→d intersection; returns { t, x, y } (t along a→b) or null
function segInt(a, b, c, d) {
  const r = { x: b.x - a.x, y: b.y - a.y }, s = { x: d.x - c.x, y: d.y - c.y };
  const den = r.x * s.y - r.y * s.x;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((c.x - a.x) * s.y - (c.y - a.y) * s.x) / den;
  const u = ((c.x - a.x) * r.y - (c.y - a.y) * r.x) / den;
  if (t < 1e-4 || t > 1 || u < 0 || u > 1) return null;
  return { t, x: a.x + r.x * t, y: a.y + r.y * t };
}

// Reflect a travelling polyline off the solid net edges so it bounces instead of
// passing through the sides/back. After a bounce it continues straight for the
// remaining arc length (approximate, but reads as a natural carom). Returns a new
// polyline of the same total length; unchanged if it never hits a net.
function reflectPath(poly, shapes) {
  if (!shapes.length || poly.length < 2) return poly;
  // drop consecutive duplicate points (boards.slide can emit a zero-length first
  // segment when the release is right on the boards) — a zero-length leg would
  // give a (0,0) heading and swallow the whole path
  const dedup = [poly[0]];
  for (let i = 1; i < poly.length; i++) {
    const p = dedup[dedup.length - 1];
    if (Math.hypot(poly[i].x - p.x, poly[i].y - p.y) > 1e-4) dedup.push(poly[i]);
  }
  if (dedup.length < 2) return poly;
  poly = dedup;
  const out = [poly[0]];
  let cur = poly[0];
  // remaining length still to travel along the original polyline
  let remain = 0;
  for (let k = 1; k < poly.length; k++) remain += Math.hypot(poly[k].x - poly[k - 1].x, poly[k].y - poly[k - 1].y);
  // direction of travel at the current point (from the source polyline)
  let idx = 1, next = poly[1];
  let dir = norm(next.x - cur.x, next.y - cur.y);
  let guard = 0;
  while (remain > 0.01 && guard++ < 200) {
    // step target: either the next source vertex (if we're still tracing it) or
    // a straight continuation after a bounce
    const step = Math.min(remain, Math.hypot(next.x - cur.x, next.y - cur.y) || remain);
    const tip = { x: cur.x + dir.x * step, y: cur.y + dir.y * step };
    // nearest solid-edge hit along cur→tip
    let hit = null;
    for (const sh of shapes) for (const [a, b] of sh.solid) {
      const h = segInt(cur, tip, a, b);
      if (h && (!hit || h.t < hit.t)) hit = { ...h, a, b };
    }
    if (hit) {
      out.push({ x: hit.x, y: hit.y });
      const trav = Math.hypot(hit.x - cur.x, hit.y - cur.y);
      remain -= trav;
      // reflect dir about the edge normal
      const ex = hit.b.x - hit.a.x, ey = hit.b.y - hit.a.y, el = Math.hypot(ex, ey) || 1;
      let nx = -ey / el, ny = ex / el;
      const dot = dir.x * nx + dir.y * ny;
      dir = norm(dir.x - 2 * dot * nx, dir.y - 2 * dot * ny);
      // nudge off the wall so we don't immediately re-hit it
      cur = { x: hit.x + dir.x * 0.05, y: hit.y + dir.y * 0.05 };
      next = { x: cur.x + dir.x * remain, y: cur.y + dir.y * remain };  // straight from here on
    } else {
      out.push(tip);
      remain -= step;
      cur = tip;
      if (Math.hypot(next.x - cur.x, next.y - cur.y) < 0.02) {
        // reached this source vertex — advance to the next one
        idx++;
        if (idx < poly.length) { next = poly[idx]; dir = norm(next.x - cur.x, next.y - cur.y); }
      }
    }
  }
  return out;
}

function norm(x, y) { const m = Math.hypot(x, y) || 1; return { x: x / m, y: y / m }; }

// Real-time puck vs nets: if a step from (x,y) to (nx,ny) crosses a net's solid
// edge (its sides/back — the mouth is open), reflect the velocity off that edge
// and stop just short. Returns { x, y, vx, vy, hit }. `rest` = bounce energy kept.
function bounceOffNets(x, y, nx, ny, vx, vy, shapes, rest = 0.72) {
  for (const sh of shapes) {
    for (const [a, b] of sh.solid) {
      const h = segInt({ x, y }, { x: nx, y: ny }, a, b);
      if (!h) continue;
      const ex = b.x - a.x, ey = b.y - a.y, el = Math.hypot(ex, ey) || 1;
      const nlx = -ey / el, nly = ex / el;                 // edge normal
      const dot = vx * nlx + vy * nly;
      // settle just outside the edge, along the normal facing the incoming puck
      const s = dot > 0 ? -1 : 1;
      return {
        x: h.x + nlx * s * 0.4, y: h.y + nly * s * 0.4,
        vx: (vx - 2 * dot * nlx) * rest, vy: (vy - 2 * dot * nly) * rest, hit: true,
      };
    }
  }
  return { x: nx, y: ny, vx, vy, hit: false };
}


// Drill text format: parser and serializer. See the DSL spec in App header.


// A puck-action index may be qualified by the branch route it lives on. On the wire
// the qualifier is the branch colour-path (hex, no #) then '.', e.g. `shoot=2ea043.3`,
// `pass=2ea043.2:F2@e5342b.1`; unqualified = the base route. ('.' not '#', since '#'
// starts a comment.) In memory the ref keeps a # on each part ("#2ea043/#e5342b").
const memToWireRef = m => m ? String(m).split("/").map(h => h.replace(/^#/, "")).join("/") : "";
const wireToMemRef = w => w ? "#" + String(w).split("/").map(h => h.replace(/^#/, "")).join("/#") : null;
const ixRef = (at, ref) => (ref ? memToWireRef(ref) + "." : "") + (at + 1);   // 1-based, optional ref prefix

/* ---------------- inventory ---------------- */

// Canonical inventory rows (a "recipe" of what a drill needs), in display order.
// A goalie is a person, so goalie-flagged nets/tires are counted under `goalie`
// (NOT under net/tire) — the one non-obvious rule. `label`/`mark` are excluded.
const INV_KINDS = ["player", "goalie", "puck", "cone", "net", "tire", "stick", "bumper", "deker", "passer", "light"];
const INV_LABELS = {
  player: "Players", goalie: "Goalies", puck: "Pucks", cone: "Cones", net: "Nets",
  tire: "Tires", stick: "Sticks", bumper: "Bumpers", deker: "Deker gates", passer: "Rebounders", light: "Lights",
};

// Merge auto-counted pieces with stored ITEM overrides into display rows:
//   { key, label, custom, autoCount, count, hide }
// autoCount is the count on the ice; count is what's shown (an override or the
// auto count); hide drops the row from the printed table only.
function deriveInventory(pieces, items = []) {
  const isGoalie = p => (p.kind === "net" || p.kind === "tire") && p.goalie;
  const auto = {};
  (pieces || []).forEach(p => {
    if (p.kind === "label" || p.kind === "mark") return;
    const k = isGoalie(p) ? "goalie" : p.kind;
    if (!INV_KINDS.includes(k)) return;
    auto[k] = (auto[k] || 0) + 1;
  });
  const ov = k => (items || []).find(it => !it.custom && it.key === k);
  const rows = INV_KINDS.filter(k => auto[k] || ov(k)).map(k => {
    const o = ov(k) || {};
    return { key: k, label: o.label || INV_LABELS[k], custom: false,
      autoCount: auto[k] || 0, count: o.count != null ? o.count : (auto[k] || 0), hide: !!o.hide };
  });
  // label is the raw user text (may be empty while editing — the `key` is the
  // internal id, NEVER shown as a fallback, so clearing the field stays cleared)
  const custom = (items || []).filter(it => it.custom).map(it => ({
    key: it.key, label: it.label || "", custom: true,
    autoCount: null, count: it.count != null ? it.count : 0, hide: !!it.hide }));
  return [...rows, ...custom];
}

/* ---------------- text format ---------------- */

// Pull the drill DSL out of a markdown ```drill fenced block, so a drill pasted
// from a note or webpage round-trips. Returns the text unchanged if no fence.
function extractDrill(text) {
  const m = /```drill[^\n]*\r?\n([\s\S]*?)```/i.exec(text);
  return m ? m[1].replace(/\s+$/, "") : text;
}

// parse a run of PATH/FORK route tokens (starting at tok[j]) into a segment array.
// Shared by PATH (base routes) and FORK (light-reaction continuations).
function parseSegments(tok, j, unq) {
  const segs = [];
  let mode = "carry", dir = "fwd", stop = 0, rate = 1, name = null, waitOn = null, jump = false, join = null, endStop = false, lock = false;
  let dsc = null, dmode = null, dsize = null, dox = null, doy = null;
  const num = () => { const v = parseFloat(tok[j++]); if (isNaN(v)) throw new Error("bad number in PATH"); return v; };
  const push = seg => {
    segs.push({ ...seg, mode, dir, stop, rate, ...(name ? { name } : {}), ...(waitOn ? { waitOn } : {}), ...(jump ? { jump: true } : {}),
      ...(join ? { join } : {}), ...(endStop ? { endStop: true } : {}), ...(lock ? { lock: true } : {}), ...(dsc ? { desc: dsc } : {}), ...(dmode ? { dmode } : {}), ...(dsize != null ? { dsize } : {}),
      ...(dox != null ? { dox, doy } : {}) });
    mode = "carry"; dir = "fwd"; stop = 0; rate = 1; name = null; waitOn = null; jump = false; join = null; endStop = false; lock = false;
    dsc = null; dmode = null; dsize = null; dox = null; doy = null;
  };
  while (j < tok.length) {
    const t = tok[j++].toUpperCase();
    if (t === "CARRY" || t === "PASS" || t === "SHOT") { mode = t.toLowerCase(); continue; }
    if (t === "FWD" || t === "BWD") { dir = t.toLowerCase(); continue; }
    if (t === "STOP") { stop = num(); continue; }
    if (t === "JUMP") { jump = true; continue; }
    if (t === "LOCK") { lock = true; continue; }
    if (t === "JOIN") { const v = (tok[j++] || "").toLowerCase(); join = (v === "smooth" || v === "sym") ? v : null; continue; }
    if (t === "ENDSTOP") { endStop = true; continue; }
    if (t === "WAIT") { const on = tok[j++]; const at = parseInt(tok[j++], 10); waitOn = { on, at: (isNaN(at) ? 1 : at) - 1, mode: "waypoint" }; continue; }
    // WACT <player> <pt> — pause until that player releases the puck at <pt> (0 = any action)
    if (t === "WACT") { const on = tok[j++]; const at = parseInt(tok[j++], 10); waitOn = { on, at: (isNaN(at) || at === 0) ? null : at - 1, mode: "action" }; continue; }
    if (t === "RATE") { rate = Math.max(0.1, num()); continue; }
    if (t === "NAME") { name = (tok[j++] || "").replace(/_/g, " ").trim() || null; continue; }
    if (t === "DESC") { dsc = unq(tok[j++]) || null; continue; }        // "free text" description
    if (t === "SHOW") { const m = (tok[j++] || "").toLowerCase(); dmode = ["auto", "preso", "label"].includes(m) ? m : null; continue; }
    if (t === "SIZE") { dsize = Math.max(0.2, num()); continue; }
    if (t === "OFF") { dox = num(); doy = num(); continue; }            // label offset from the waypoint
    if (t === "L") push({ type: "L", x: num(), y: num() });
    else if (t === "Q") push({ type: "Q", cx: num(), cy: num(), x: num(), y: num() });
    else if (t === "C") push({ type: "C", c1x: num(), c1y: num(), c2x: num(), c2y: num(), x: num(), y: num() });
    else throw new Error(`unknown token "${t}" (use L Q C, PASS SHOT CARRY, FWD BWD, STOP n, RATE n)`);
  }
  return segs;
}

// If a drill has a shot but NO shooting target on the board, auto-place an
// empty net in the crease nearest each shooter (one per end as needed) —
// otherwise doShot aims at a phantom point: no cage, no carom, no outcome.
// Any net or passer counts as a target (both auto-attract shots); a shot
// pinned to an existing bumper/tire is an explicit deflect, not needy.
// Pure: returns the SAME array when there is nothing to add (callers use
// that to skip state updates), else a copy with the net(s) appended.
function ensureShotNet(pieces) {
  if (!pieces || pieces.some(p => p.kind === "net" || p.kind === "passer")) return pieces;
  const byId = {};
  pieces.forEach(p => { byId[p.id] = p; });
  const deflect = id => { const q = id && byId[id]; return !!(q && (q.kind === "bumper" || q.kind === "tire")); };
  // follow a mem ref ("#a/#b") down a piece's fork tree to its route node
  const nodeByRef = (p, ref) => {
    let list = p && p.forks, node = null;
    for (const part of String(ref).split("/")) {
      node = (list || []).find(f => (f.color || "").toLowerCase() === part.toLowerCase());
      if (!node) return null;
      list = node.forks;
    }
    return node;
  };
  // rough release x — only which half of the ice matters (mirrors doShot's
  // side fallback): the shooter's route point at the shot index, else the
  // shooter's own spot, else the puck's
  const releaseX = (pk, t, shooterId) => {
    const sh = shooterId ? byId[shooterId] : null;
    let path = sh ? sh.path : null;
    if (t.ref) {
      const node = nodeByRef(sh, t.ref) || pieces.map(p => nodeByRef(p, t.ref)).find(Boolean);
      if (node) path = node.path;
    }
    if (path && path.length) return path[Math.max(0, Math.min(t.at || 0, path.length - 1))].x;
    return sh ? sh.x : pk.x;
  };
  const sides = new Set();
  const addSide = (x, pin) =>
    sides.add(pin === "left" || pin === "right" ? pin : x < 100 ? "left" : "right");
  pieces.forEach(pk => {
    const chainEnd = (pk.transfers || []).length ? pk.transfers[pk.transfers.length - 1].to
      : (pk.carrier || (pk.pickup && pk.pickup.to) || null);
    (pk.terminals || []).forEach(t => {
      if (t.kind === "shot" && !deflect(t.net)) addSide(releaseX(pk, t, t.by || chainEnd), t.net);
    });
    (pk.transfers || []).forEach((t, k) => {   // rebound= — a shot whose carom is collected
      if (t.kind !== "shot" || deflect(t.net)) return;
      const rel = t.by || (k ? pk.transfers[k - 1].to : (pk.carrier || (pk.pickup && pk.pickup.to) || null));
      addSide(releaseX(pk, t, rel), t.net);
    });
    const walk = list => (list || []).forEach(f => {   // BRANCH … shoot[:net]
      if (f.action === "shoot" && !deflect(f.net)) {
        const seg = (f.path || [])[(f.path || []).length - 1];
        addSide(seg ? seg.x : pk.x, f.net);
      }
      walk(f.forks);
    });
    walk(pk.forks);
  });
  if (!sides.size) return pieces;
  const used = new Set(pieces.map(p => p.id));
  let n = 1;
  const out = pieces.slice();
  ["left", "right"].forEach(side => {
    if (!sides.has(side)) return;
    while (used.has("N" + n)) n++;
    used.add("N" + n);
    out.push({ id: "N" + n, kind: "net", x: side === "left" ? 11 : 189, y: 42.5, color: "#c81e33",
      label: "", text: "", size: 1, speed: 1, hand: "R", sym: "", carrier: null,
      facing: side === "left" ? 0 : 180, transfers: [], pickup: null, net: null,
      holdLine: false, goalie: false, defense: false, wait: null, group: null,
      crease: false, lock: false, cues: [], mode: "reactive", alwaysColor: null,
      lightId: null, forks: [], path: [] });
  });
  return out;
}

function parseDrill(text) {
  const pieces = [];
  const byId = {};
  let rink = "full";
  let title = "", desc = "";
  // presentation steps: authored narration beats, each anchored to an absolute
  // time (at=) or a player's waypoint activation (on=<id>:<pt>). See serializeDrill.
  const steps = [];
  // the DSL schema version the drill declares (a `DSL <n>` header). Absent → treat
  // as the current version (no back-compat gating yet); a reader may branch on it.
  let dslVersion = DSL_VERSION;
  // coaching writeup: a multi-line markdown NOTES … END NOTES block, captured
  // verbatim (see serializeDrill). `items` holds inventory overrides / custom
  // gear rows; auto counts derive from the pieces at render time.
  let notes = null, capturingNotes = false;
  const noteBuf = [];
  const items = [];
  const errors = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    // NOTES block capture mode: pipe-prefixed body lines are taken verbatim
    // (no comment-strip / tokenize) until a bare `END NOTES`. The `| ` prefix on
    // every body line means a coach's own `END NOTES` line can never terminate it.
    if (capturingNotes) {
      if (raw.trim() === "END NOTES") { notes = noteBuf.join("\n"); capturingNotes = false; }
      else { const m = /^\|( (.*))?$/.exec(raw); noteBuf.push(m ? (m[2] || "") : raw); }
      return;
    }
    if (/^\s*NOTES\s*$/.test(raw)) { capturingNotes = true; noteBuf.length = 0; return; }
    // TITLE/DESC take the whole rest of the line (may contain spaces or #)
    const meta = /^\s*(title|desc)\b\s*(.*)$/i.exec(raw);
    if (meta) { if (meta[1].toLowerCase() === "title") title = meta[2].trim(); else desc = meta[2].trim(); return; }
    // pull "quoted strings" out first (label / description text) so their spaces,
    // commas and #s survive comment-stripping and tokenizing; restore via unq()
    const quotes = [];
    const protectedRaw = raw.replace(/"([^"]*)"/g, (_, s) => `${quotes.push(s.trim()) - 1}`);
    const line = protectedRaw.replace(/#(?!([0-9a-fA-F]{3}){1,2}\b).*$/, "").trim();
    if (!line) return;
    const tok = line.split(/[\s,]+/);
    const unq = t => { const m = /^(\d+)$/.exec(t || ""); return m ? quotes[+m[1]] : t; };
    const quoted = t => /^\d+$/.test(t || "");
    const cmd = tok[0].toUpperCase();
    try {
      if (cmd === "DSL") {
        const n = parseInt(tok[1], 10);
        if (isNaN(n) || n < 1) throw new Error(`DSL needs a version number, got "${tok[1] || ""}"`);
        dslVersion = n;
      } else if (cmd === "RINK") {
        const m = (tok[1] || "").toLowerCase();
        if (!VIEWS[m]) throw new Error(`unknown rink "${tok[1]}"`);
        rink = m;
      } else if (cmd === "PIECE") {
        const [, id, kind, xs, ys, ...rest] = tok;
        const x = parseFloat(xs), y = parseFloat(ys);
        if (!id || !["player", "puck", "cone", "net", "bumper", "deker", "passer", "label", "tire", "stick", "light"].includes(kind) || isNaN(x) || isNaN(y))
          throw new Error("PIECE needs: id kind x y");
        let color = kind === "cone" ? "#e0731d" : kind === "puck" ? "#14171a" : kind === "net" ? "#c81e33"
          : kind === "bumper" ? "#1b1e22" : kind === "deker" ? "#c79a4e" : kind === "passer" ? "#57636f"
          : kind === "label" ? "#14202b" : kind === "tire" ? "#1c1c1e" : kind === "stick" ? "#20242a" : kind === "light" ? "#2ea043" : "#d7263d";
        let label = kind === "player" ? id : "";
        let text = "", size = 1;                          // label piece: text + font scale
        let bg = null, bgOp = null, border = null, borderOp = null, textOp = null;   // label styling ("none" | #hex + opacity)
        let speed = 1, hand = "R", sym = "", carrier = null, facing = 0, pickup = null;
        const terminals = [];                                   // uniform list of chain ENDS — each { kind:"shot"|"rim"|"chip", at, ref, by?, net?/aim?/dist? } — so every branch's end is independent
        let net = null, holdLine = false, goalie = false, defense = false, wait = null, group = null, crease = false, lock = false;
        let cues = [], rand = true, lmode = null, alwaysColor = null;   // light: cue timeline + route mode
        let lightId = null;                               // player: designated reaction light to read (else nearest)
        const transfers = [];
        rest.forEach(r => {
          if (quoted(r)) { text = unq(r); }              // a "quoted string" → label text
          else if (r.startsWith("#")) color = r;
          else if (r.includes("=")) {
            const [k, v] = r.split("=");
            const key = k.toLowerCase();
            if (key === "speed") {
              const n = parseFloat(v);
              if (!isNaN(n) && n > 0) speed = n;
            } else if (key === "size") {
              const n = parseFloat(v);
              if (!isNaN(n) && n > 0) size = n;
            } else if (key === "bg" || key === "border") {

              else {
                const [hex, op] = v.split(":");
                if (/^#?[0-9a-fA-F]{3,6}$/.test(hex)) {
                  const col = "#" + hex.replace(/^#/, "");
                  const n = op != null ? parseFloat(op) : NaN;

              const n = parseFloat(v);

            } else if (key === "hand") hand = v.toUpperCase() === "L" ? "L" : "R";
            else if (key === "sym") sym = unq(v).replace(/_/g, " ").trim().slice(0, 3);  // whiteboard symbol

            else if (key === "on") carrier = v;
            else if (key === "pass") {
              // pass=[<ref>.]<pt>:<to>[@[<ref>.]<recvPt>][^<passer>][%<by>][!] — an
              // optional <ref># qualifies a release/reception on a branch route; a
              // ^passer makes it a give-and-go; %<by> pins WHO releases (needed after
              // sibling-branch receivers, where the holder is per-run ambiguous); a
              // trailing ! is a sauce (raised) pass
              const m2 = /^(?:([0-9a-fA-F/]+)\.)?(\d+):([^@\s^!%]+)(?:@(?:([0-9a-fA-F/]+)\.)?(\d+))?(?:\^([^!%\s]+))?(?:%([^!\s]+))?(!)?$/.exec(v);
              if (m2) transfers.push({ at: parseInt(m2[2], 10) - 1, to: m2[3],
                recvAt: m2[4] || m2[5] ? parseInt(m2[5], 10) - 1 : null, kind: "pass",
                ...(m2[1] ? { atRef: wireToMemRef(m2[1]) } : {}), ...(m2[4] ? { recvRef: wireToMemRef(m2[4]) } : {}),
                ...(m2[6] ? { via: m2[6] } : {}), ...(m2[7] ? { by: m2[7] } : {}), ...(m2[8] ? { sauce: true } : {}) });

              // gather at their @<pt> (else route end / where they stand)
              // rebound=[<ref>.]<pt>:<to>[@[<ref>.]<recvPt>][>net][%<by>] — >net gives

                recvAt: m4[4] || m4[5] ? parseInt(m4[5], 10) - 1 : null, kind: "shot",
                ...(m4[1] ? { atRef: wireToMemRef(m4[1]) } : {}), ...(m4[4] ? { recvRef: wireToMemRef(m4[4]) } : {}),

            } else if (key === "shoot") {
              // shoot=[<ref>.]<pt>[^<shooter>][>net] — a terminal shot. `^<shooter>` pins
              // WHICH player shoots (when several conditional receivers could each be the
              // final holder). Each terminal is its own independent entry in terminals[].
              const ms = /^(?:([0-9a-fA-F/]+)\.)?(\d+)(?:\^([^>\s]+))?(?:>(\S+))?$/.exec(v);
              if (ms) terminals.push({ kind: "shot", at: parseInt(ms[2], 10) - 1, ref: ms[1] ? wireToMemRef(ms[1]) : "", ...(ms[3] ? { by: ms[3] } : {}), ...(ms[4] ? { net: ms[4] } : {}) });

              // sets its direction (~<deg>) and distance (*<ft>). The player-handoff
              // form rim=[<ref>.]<pt>:<player>[@[<ref>.]<pt>][%<by>] carries to a
              // collector instead, %<by> pinning who releases (as with pass=).
              // …the TERMINAL form pins its player with `^<shooter>` (before ~aim/*dist),
              // like shoot=, so a cross-run rim/chip lands on the right receiver only.
              const m5 = /^(?:([0-9a-fA-F/]+)\.)?(\d+)(?::([^@\s~*^%]+)(?:@(?:([0-9a-fA-F/]+)\.)?(\d+))?)?(?:\^([^~*%\s]+))?(?:%([^~*\s]+))?(?:~(-?\d+(?:\.\d+)?))?(?:\*(\d+(?:\.\d+)?))?$/.exec(v);
              if (m5) {
                const aim = m5[8] != null ? parseFloat(m5[8]) : null;
                const dist = m5[9] != null ? parseFloat(m5[9]) : null;
                const at = parseInt(m5[2], 10) - 1, ref = m5[1] ? wireToMemRef(m5[1]) : null, by = m5[6] || null, tby = m5[7] || null;
                if (m5[3]) transfers.push({ at, to: m5[3],
                  recvAt: m5[4] || m5[5] ? parseInt(m5[5], 10) - 1 : null, kind: key,
                  ...(ref ? { atRef: ref } : {}), ...(m5[4] ? { recvRef: wireToMemRef(m5[4]) } : {}),
                  ...(tby ? { by: tby } : {}), ...(aim != null ? { aim } : {}) });
                else terminals.push({ kind: key, at, ref: ref || "", ...(by ? { by } : {}), ...(aim != null ? { aim } : {}), ...(dist != null ? { dist } : {}) });
              }
            } else if (key === "pickup") {
              // pickup=<player>@[<ref>.]<pt>[*] — trailing * = a live "nearest loose puck"
              // collect that re-resolves at play time instead of a fixed puck
              const m3 = /^([^@\s]+)@(?:([0-9a-fA-F/]+)\.)?(\d+)(\*)?$/.exec(v);
              if (m3) pickup = { to: m3[1], at: parseInt(m3[3], 10) - 1, ...(m3[2] ? { atRef: wireToMemRef(m3[2]) } : {}), ...(m3[4] ? { nearest: true } : {}) };
            } else if (key === "net") {
              net = v;                                   // a net piece id (or left/right for legacy)
            } else if (key === "hold") {
              if (v.toLowerCase() === "line") holdLine = true;
            } else if (key === "wait" || key === "act") {
              // wait=<player>[@<pt>] — hold until that player REACHES point <pt>.
              // act=<player>[@<pt>] — hold until that player RELEASES the puck
              // (pass/chip/rim/shot) at <pt>; no @<pt> = at any of their actions.
              const mw = /^([^@\s]+)(?:@(\d+))?$/.exec(v);
              if (mw) wait = { on: mw[1], mode: key === "act" ? "action" : "waypoint",
                at: mw[2] ? parseInt(mw[2], 10) - 1 : (key === "act" ? null : 0) };
            } else if (key === "face") {

            } else if (key === "cues") {

                const m6 = /^([0-9a-fA-F]{3,6}):(\d+(?:\.\d+)?)$/.exec(seg);

              // — how a "read the light" fork chooses its route. always:<hex> designates
              // the one cue colour whose route always runs.
              const [mm, hex] = v.split(":");
              const mk = (mm || "").toLowerCase();
              if (["reactive", "sequence", "random", "always"].includes(mk)) lmode = mk;
              if (hex && /^[0-9a-fA-F]{3,6}$/.test(hex)) alwaysColor = "#" + hex;
            } else if (key === "always") { if (/^#?[0-9a-fA-F]{3,6}$/.test(v)) alwaysColor = "#" + v.replace(/^#/, ""); }

            else if (key === "group") group = v.replace(/_/g, " ").trim() || null;   // named group membership
          } else if (r === "goalie") goalie = true;
          else if (r === "crease") crease = true;
          else if (r === "defense") defense = true;
          else if (r === "lock") lock = true;
          else label = r;
        });
        const mode = lmode || (rand === false ? "sequence" : "reactive");   // legacy rand=off → sequence
        // a bare net= token targets every shot terminal that didn't carry its own >net
        if (net) terminals.forEach(t => { if (t.kind === "shot" && !t.net) t.net = net; });
        const p = { id, kind, x, y, color, label, text, size, speed, hand, sym, carrier, facing, transfers, pickup, ...(terminals.length ? { terminals } : {}), net, holdLine, goalie, defense, wait, group, crease, lock, cues, mode, alwaysColor, lightId, ...(bg ? { bg } : {}), ...(bgOp != null ? { bgOp } : {}), ...(border ? { border } : {}), ...(borderOp != null ? { borderOp } : {}), ...(textOp != null ? { textOp } : {}), forks: [], path: [] };
        pieces.push(p); byId[id] = p;
      } else if (cmd === "PATH") {
        const id = tok[1];
        const p = byId[id];
        if (!p) throw new Error(`PATH for unknown piece "${id}"`);
        p.path = parseSegments(tok, 2, unq);
      } else if (cmd === "FORK" || cmd === "BRANCH") {
        // BRANCH <player> <ref> [at=<pt>] [<action>[:target]] <segments…> — a
        // conditional route continuation ("multiple routes off one waypoint").
        // `ref` is a slash-path of cue colours (hex, no leading #): "green" is a
        // top-level branch, "green/red" the red branch chained off the green (skate)
        // one. Optional `at=<pt>` (1-based) is the parent waypoint the branch departs
        // from (default = parent route end). An optional action says what the player
        // does at its end: skate (default) / shoot[:net] / chip / rim / pass:to.
        // FORK is the legacy keyword — read identically so old drills still load.
        const id = tok[1], col = tok[2];
        const p = byId[id];
        if (!p) throw new Error(`${cmd} for unknown piece "${id}"`);
        const refParts = String(col || "").split("/");
        if (!refParts.every(h => /^[0-9a-fA-F]{3,6}$/.test(h))) throw new Error(`${cmd} needs: id colour[/colour…] segments`);
        let j = 3, action = "skate", net = null, to = null, at = null, cond = null;

        if (atm) { at = parseInt(atm[1], 10) - 1; j++; }
        // optional selection condition (default = light cue matching the ref colour):
        // rand[=weight] · seq=<n> · always · if=<hex> (explicit light cue colour) ·
        // has (this player holds the puck) · link=<player>/<route> (that player took that
        // route) · when=<player>@<pt> (reached wp) / when=<player>!<pt> (released puck)
        let cm; const ct = tok[j] || "";

        else if ((cm = /^seq=(\d+)$/i.exec(ct))) { cond = { type: "sequence", ord: parseInt(cm[1], 10) }; j++; }
        else if (/^always$/i.test(ct)) { cond = { type: "always" }; j++; }
        else if ((cm = /^if=([0-9a-fA-F]{3,6})(?:@(\S+))?$/i.exec(ct))) { cond = { type: "light", color: "#" + cm[1], ...(cm[2] ? { lightId: cm[2] } : {}) }; j++; }
        else if ((cm = /^has(?:=(\S+))?$/i.exec(ct))) { cond = { type: "possession", ...(cm[1] ? { player: cm[1] } : {}) }; j++; }   // has = I hold; has=<player> = THEY hold
        else if ((cm = /^link=([^/\s]+)\/([0-9a-fA-F/]+)$/i.exec(ct))) { cond = { type: "link", player: cm[1], route: wireToMemRef(cm[2]) }; j++; }
        else if ((cm = /^when=([^@!\s]+)([@!])?(\d+)?$/i.exec(ct))) {
          const mode = cm[2] === "@" ? "waypoint" : "action";
          cond = { type: "event", on: cm[1], mode, ...(cm[3] ? { at: parseInt(cm[3], 10) - 1 } : (mode === "waypoint" ? { at: 0 } : {})) };
          j++;
        }
        const am = /^(skate|shoot|chip|rim|pass)(?::(\S+))?$/i.exec(tok[j] || "");
        if (am) { action = am[1].toLowerCase(); if (action === "shoot") net = am[2] || null; else if (action === "pass") to = am[2] || null; j++; }
        // navigate/create the parent chain (parents are emitted before children), add leaf
        let list = (p.forks = p.forks || []);
        for (let k = 0; k < refParts.length - 1; k++) {
          const c = "#" + refParts[k];
          let node = list.find(f => f.color.toLowerCase() === c.toLowerCase());
          if (!node) { node = { color: c, action: "skate", forks: [], path: [] }; list.push(node); }
          list = (node.forks = node.forks || []);
        }
        list.push({ color: "#" + refParts[refParts.length - 1], action,
          ...(net ? { net } : {}), ...(to ? { to } : {}), ...(at != null ? { at } : {}),
          ...(cond ? { cond } : {}), forks: [], path: parseSegments(tok, j, unq) });
      } else if (cmd === "MARK") {
        // MARK <id> <color> <width> <style> x1,y1 x2,y2 ...  (a freehand ink annotation)
        // the style token is optional (imports often omit it): when tok[4]
        // isn't a style word, everything from index 4 on is flags + coords
        const styleWords = ["solid", "dashed", "dotted", "wavy"];
        const hasStyle = styleWords.includes((tok[4] || "").toLowerCase());
        const mid = tok[1], mcol = tok[2] || "#ffd447", mw = parseFloat(tok[3]) || 1.1, mst = hasStyle ? tok[4].toLowerCase() : "solid";
        const rest = tok.slice(hasStyle ? 5 : 4);
        // a bare `lock` flag may sit among the trailing tokens; coords are pure
        // numbers (the tokenizer splits on commas), so it never collides with them
        const mlock = rest.some(t => t.toLowerCase() === "lock");
        // `note` = annotation ink the smart pen's converter leaves alone, so a
        // scribbled reminder survives Convert. Unlike `lock` it stays fully
        // selectable and erasable — it opts out of recognition, nothing else.
        const mnote = rest.some(t => t.toLowerCase() === "note");
        // optional independent area fill: fill=<hex>[:<opacity 0..1>] — non-
        // numeric, so older readers drop it harmlessly via the isNaN filter
        const mfTok = rest.find(t => /^fill=/i.test(t));
        let mfill = null, mfillOp = 0.25;
        if (mfTok) {
          const [fc, fo] = mfTok.slice(5).split(":");
          if (fc) mfill = fc.startsWith("#") ? fc : "#" + fc;
          const op = parseFloat(fo);
          if (!isNaN(op)) mfillOp = Math.max(0.05, Math.min(1, op));
        }
        const nums = rest.map(Number).filter(n => !isNaN(n));
        const pts = [];
        for (let k = 0; k + 1 < nums.length; k += 2) pts.push({ x: nums[k], y: nums[k + 1] });
        // optional sharp-corner point indices: corners=i;j;k — the curve
        // BREAKS at these points instead of smoothing through them (older
        // readers drop the token harmlessly via the isNaN filter)
        // per-point stylus pressure for note ink: press=<v>;<v>;… one per point
        // (2dp, 0..1). Older readers drop the token via the isNaN filter.
        const mpTok = rest.find(t => /^press=/i.test(t));
        const mpress = mpTok
          ? mpTok.slice(6).split(";").map(v => (v === "" ? null : parseFloat(v)))
          : null;
        const mcTok = rest.find(t => /^corners=/i.test(t));
        if (mcTok) mcTok.slice(8).split(";").forEach(s => { const i = parseInt(s, 10); if (pts[i]) pts[i].c = true; });
        if (mid && pts.length >= 2) {
          const m = { id: mid, kind: "mark", color: mcol, width: mw, style: ["dashed", "dotted", "wavy"].includes(mst) ? mst : "solid",
            ...(mlock ? { lock: true } : {}), ...(mnote ? { note: true } : {}),
            ...(mpress && mpress.length === pts.length ? { press: mpress } : {}),
            ...(mfill ? { fill: mfill, fillOp: mfillOp } : {}), x: pts[0].x, y: pts[0].y, pts, path: [] };
          pieces.push(m); byId[mid] = m;
        }
      } else if (cmd === "STEP") {
        // STEP at=<seconds> "text"   OR   STEP on=<pieceId>:<pt> "text"
        // waypoint number is 1-based on the wire, stored 0-based as wp. Optional
        // pos=<x>:<y> is the caption's saved spot in RINK FEET (x 0..200, y 0..85),
        // so it holds the same ice area across portrait/landscape.
        let at = null, on = null, txt = "", pos = null;
        const clampX = n => Math.max(0, Math.min(200, n)), clampY = n => Math.max(0, Math.min(85, n));
        tok.slice(1).forEach(r => {
          if (quoted(r)) txt = unq(r);
          else if (/^at=/i.test(r)) { const n = parseFloat(r.slice(3)); if (!isNaN(n)) at = Math.max(0, n); }
          else if (/^on=/i.test(r)) { const m = /^([^:]+):(\d+)$/.exec(r.slice(3)); if (m) on = { piece: m[1], wp: parseInt(m[2], 10) - 1 }; }
          else if (/^pos=/i.test(r)) { const m = /^(-?\d*\.?\d+):(-?\d*\.?\d+)$/.exec(r.slice(4)); if (m) pos = { x: clampX(parseFloat(m[1])), y: clampY(parseFloat(m[2])) }; }
        });
        const anchor = on ? { on } : at != null ? { at } : null;
        if (anchor) steps.push({ text: txt, ...anchor, ...(pos ? { pos } : {}) });
      } else if (cmd === "ITEM") {
        // ITEM <key> [count=<n>] [hide] ["Label"] — an inventory row. A canonical
        // <key> overrides/hides its auto-derived row; any other key is a custom
        // off-ice gear row (whistles, pinnies, water) carrying its own label.
        const key = tok[1];
        let count = null, hide = false, label = "";
        tok.slice(2).forEach(r => {
          if (quoted(r)) label = unq(r);
          else if (/^count=/i.test(r)) { const n = parseInt(r.slice(6), 10); if (!isNaN(n) && n >= 0) count = n; }
          else if (r.toLowerCase() === "hide") hide = true;
        });
        if (key) items.push({ key, ...(count != null ? { count } : {}), ...(hide ? { hide: true } : {}),
          ...(label ? { label } : {}), ...(INV_KINDS.includes(key) ? {} : { custom: true }) });
      } else throw new Error(`unknown command "${tok[0]}"`);
    } catch (e) { errors.push(`line ${i + 1}: ${e.message}`); }
  });
  if (capturingNotes) notes = noteBuf.join("\n");   // unterminated NOTES: flush what we have
  return { rink, pieces: ensureShotNet(pieces), errors, title, desc, dslVersion, steps, notes: notes || "", items };
}

const f1 = n => (Math.round(n * 10) / 10).toString();
const f2 = n => (Math.round(n * 100) / 100).toString();

const qesc = t => `"${String(t).replace(/"/g, "")}"`;   // label/description text as a quoted string

function segToStr(s) {
  let pre = "";
  if (s.name) pre += `NAME ${String(s.name).trim().replace(/\s+/g, "_")} `;
  if (s.desc) {
    pre += `DESC ${qesc(s.desc)} `;
    if (s.dmode && s.dmode !== "auto") pre += `SHOW ${s.dmode} `;
    if (s.dmode === "label") {
      if (s.dsize && s.dsize !== 1) pre += `SIZE ${f2(s.dsize)} `;
      pre += `OFF ${f1(s.dox || 0)},${f1(s.doy != null ? s.doy : -5)} `;
    }
  }
  if (s.stop > 0) pre += `STOP ${f1(s.stop)} `;
  if (s.jump) pre += "JUMP ";
  if (s.lock) pre += "LOCK ";
  if (s.join === "smooth" || s.join === "sym") pre += `JOIN ${s.join} `;
  if (s.endStop) pre += "ENDSTOP ";
  if (s.waitOn && s.waitOn.on) pre += s.waitOn.mode === "action"
    ? `WACT ${s.waitOn.on} ${s.waitOn.at != null ? s.waitOn.at + 1 : 0} `
    : `WAIT ${s.waitOn.on} ${(s.waitOn.at ?? 0) + 1} `;
  if (s.rate && s.rate !== 1) pre += `RATE ${f2(s.rate)} `;
  if (s.dir === "bwd") pre += "BWD ";
  if (s.mode && s.mode !== "carry") pre += s.mode.toUpperCase() + " ";
  if (s.type === "L") return `${pre}L ${f1(s.x)},${f1(s.y)}`;
  if (s.type === "Q") return `${pre}Q ${f1(s.cx)},${f1(s.cy)} ${f1(s.x)},${f1(s.y)}`;
  return `${pre}C ${f1(s.c1x)},${f1(s.c1y)} ${f1(s.c2x)},${f1(s.c2y)} ${f1(s.x)},${f1(s.y)}`;
}

function serializeDrill(rink, pieces, title = "", desc = "", steps = [], notes = "", items = []) {
  // stamp the schema version that wrote this text (first line, so a reader can
  // branch before parsing the body). Always the current DSL_VERSION on save.
  const out = [`DSL ${DSL_VERSION}`, `RINK ${rink}`];
  if (title && title.trim()) out.push(`TITLE ${title.trim()}`);
  if (desc && desc.trim()) out.push(`DESC ${desc.trim()}`);
  // coaching writeup: pipe-prefix every body line so nothing in the markdown
  // (blank lines, a literal `END NOTES`) can collide with the terminator.
  if (notes && notes.trim()) {
    out.push("NOTES");
    notes.replace(/\r\n?/g, "\n").split("\n").forEach(l => out.push(l === "" ? "|" : "| " + l));
    out.push("END NOTES");
  }
  out.push("");
  pieces.forEach(p => {
    if (p.kind === "label") {
      const sz = p.size && p.size !== 1 ? ` size=${f2(p.size)}` : "";
      const lk = p.lock ? " lock" : "";
      // bg=/border=/textop= are omitted at the defaults so old drills round-trip unchanged
      const bgT = p.bg === "none" ? " bg=none"
        : (p.bg && p.bg !== "#f6fbfd") || (p.bgOp != null && p.bgOp !== 0.95)
          ? ` bg=${String(p.bg || "#f6fbfd").replace("#", "")}:${f2(p.bgOp != null ? p.bgOp : 0.95)}` : "";
      const bdT = p.border === "none" ? " border=none"
        : (p.border && p.border !== "#14202b") || (p.borderOp != null && p.borderOp !== 0.35)
          ? ` border=${String(p.border || "#14202b").replace("#", "")}:${f2(p.borderOp != null ? p.borderOp : 0.35)}` : "";
      const toT = p.textOp != null && p.textOp !== 1 ? ` textop=${f2(p.textOp)}` : "";
      out.push(`PIECE ${p.id} label ${f1(p.x)} ${f1(p.y)} ${p.color}${sz}${bgT}${bdT}${toT}${lk} ${qesc(p.text || "")}`);
      return;
    }
    if (p.kind === "mark") {
      const lk = p.lock ? " lock" : "";
      const nt = p.note ? " note" : "";

      out.push(`MARK ${p.id} ${p.color} ${f2(p.width || 1.1)} ${p.style || "solid"}${lk}${nt}${fl}${cr}${pr} ${(p.pts || []).map(q => `${f1(q.x)},${f1(q.y)}`).join(" ")}`);

    const spd = p.speed && p.speed !== 1 ? ` speed=${f2(p.speed)}` : "";
    const hnd = (p.kind === "player" || p.kind === "stick") && p.hand === "L" ? " hand=L" : "";
    // whiteboard-mode symbol (X/O/F/W1…); underscore-escaped like label/group
    const sm = p.kind === "player" && p.sym && String(p.sym).trim()
      ? ` sym=${String(p.sym).trim().slice(0, 3).replace(/[\s,]+/g, "_")}` : "";
    const car = p.kind === "puck" && p.carrier ? ` on=${p.carrier}` : "";
    const gp = p.kind === "puck" && !p.carrier && p.pickup ? ` pickup=${p.pickup.to}@${ixRef(p.pickup.at, p.pickup.atRef)}${p.pickup.nearest ? "*" : ""}` : "";
    // chain transfers in order: pass= passes, rebound= shot handoffs, rim=/chip= board plays.
    // Validity is POSSIBILITY-based: every receiver so far could be the holder on their
    // own branch's run, so a sibling-branch releaser is valid. An impossible step (an
    // actor never in the chain by then) is dropped — but ONLY that step: entries after
    // it are independent parallel runs, not a dependent linear tail.
    const kw = t => t.kind === "shot" ? "rebound" : t.kind === "rim" ? "rim" : t.kind === "chip" ? "chip" : "pass";
    // who releases transfer s, inferred the same way the app does (holder on the
    // release lineage) — `%<by>` is emitted only when the pin DIFFERS from this, so
    // legacy linear chains round-trip byte-stable.
    const isAnc = (a, b) => { const A = String(a || "").toLowerCase(), B = String(b || "").toLowerCase(); return !A || A === B || B.startsWith(A + "/"); };
    const inferRel = s => { const ts = p.transfers || [], t = ts[s];
      let h = p.carrier || (p.pickup && isAnc(p.pickup.atRef, t.atRef) ? p.pickup.to : null);

      const held = new Set([(p.carrier || (p.pickup && p.pickup.to)) || null]);
      (p.transfers || []).forEach((t, s) => {

      ? vts.map(({ t, s }) => {

      : "";

    // pinning its shooter with `^<by>` (before ~aim/*dist for rim/chip) and its own
    // >net for a shot, so sibling-branch terminals never overwrite each other.
    const byTag = a => a ? "^" + a : "";
    const terms = head && (p.terminals || []).length
      ? (p.terminals || []).map(t => t.kind === "shot" ? ` shoot=${ixRef(t.at, t.ref)}${byTag(t.by)}${t.net ? ">" + t.net : ""}`
          : ` ${t.kind}=${ixRef(t.at, t.ref)}${byTag(t.by)}${t.aim != null ? "~" + f1(t.aim) : ""}${t.dist != null ? "*" + f1(t.dist) : ""}`).join("")
      : "";
    // no bare net= is written: a shot terminal carries its own >net (absence = nearest,
    // which a bare token would wrongly re-pin on reload) and rebound transfers theirs.
    // The parser still READS net= so legacy drills load.
    const rotatable = p.kind === "net" || p.kind === "bumper" || p.kind === "deker" || p.kind === "passer" || p.kind === "stick" || p.kind === "light" || (p.kind === "player" && !p.path.length);
    const fac = rotatable && p.facing ? ` face=${f1(p.facing)}` : "";
    const hld = p.kind === "player" && p.holdLine ? " hold=line" : "";
    const wt = p.kind === "player" && p.wait && p.wait.on
      ? (p.wait.mode === "action"
          ? ` act=${p.wait.on}${p.wait.at != null ? "@" + (p.wait.at + 1) : ""}`
          : ` wait=${p.wait.on}@${(p.wait.at ?? 0) + 1}`)
      : "";
    const gl = (p.kind === "net" || p.kind === "tire") && p.goalie ? " goalie" : "";
    const crs = p.kind === "net" && p.crease ? " crease" : "";
    const df = p.kind === "player" && p.defense ? " defense" : "";
    const lck = p.lock ? " lock" : "";
    const siz = (p.kind === "net" || p.kind === "tire") && p.size && p.size !== 1 ? ` size=${f2(p.size)}` : "";
    const grp = p.group ? ` group=${String(p.group).trim().replace(/\s+/g, "_")}` : "";

    const lgt = p.kind === "player" && p.lightId ? ` light=${p.lightId}` : "";

      ? ` cues=${p.cues.map(c => `${String(c.color || "").replace("#", "")}:${f1(c.dur || 0)}`).join(";")}` : "";

    // always:<hex> carries the designated cue colour whose route always runs.

      ? (lm === "always"

    // the action the player performs at its end (skate default → omitted). Branches
    // nest — a skate branch can chain another — so the colour ref is a slash-path
    // (parent/child) and the whole tree is emitted, parents before children. An
    // `at=<pt>` records a branch that departs before the parent route's end.
    const emitBranches = (branches, prefix) => (branches || []).forEach(f => {
      if (!f.path || !f.path.length) return;
      const ref = (prefix ? prefix + "/" : "") + String(f.color || "").replace("#", "");
      const at = typeof f.at === "number" ? ` at=${f.at + 1}` : "";
      // selection condition — omit for a plain light cue matching the ref colour (the
      // default), so legacy reaction branches round-trip unchanged
      const c = f.cond;
      const hex = s => String(s || "").replace("#", "").toLowerCase();
      const cond = !c ? ""
        : c.type === "random" ? ` rand${c.weight != null && c.weight !== 1 ? "=" + c.weight : ""}`
        : c.type === "sequence" ? ` seq=${c.ord ?? 0}`
        : c.type === "always" ? " always"
        : c.type === "possession" ? ` has${c.player ? "=" + c.player : ""}`
        : (c.type === "link" && c.player && c.route) ? ` link=${c.player}/${memToWireRef(c.route)}`
        : (c.type === "event" && c.on) ? ` when=${c.on}${c.mode === "waypoint" ? "@" + ((c.at ?? 0) + 1) : "!" + (c.at != null ? c.at + 1 : "")}`
        : (c.type === "light" && ((c.color && hex(c.color) !== hex(f.color)) || c.lightId)) ? ` if=${hex(c.color || f.color)}${c.lightId ? "@" + c.lightId : ""}`
        : "";
      const act = f.action && f.action !== "skate"
        ? " " + f.action + (f.action === "shoot" && f.net ? ":" + f.net : f.action === "pass" && f.to ? ":" + f.to : "")
        : "";
      out.push(`BRANCH ${p.id} ${ref}${at}${cond}${act} ${f.path.map(segToStr).join(" ")}`);
      emitBranches(f.forks, ref);
    });
    emitBranches(p.forks, "");

  (steps || []).forEach(s => {
    const anchor = s.on ? `on=${s.on.piece}:${s.on.wp + 1}` : `at=${f2(s.at || 0)}`;
    const pos = s.pos ? ` pos=${f1(s.pos.x)}:${f1(s.pos.y)}` : "";

  // written; a pristine drill emits none and the table stays fully auto-derived.
  (items || []).forEach(it => {

    if (it.count != null) parts.push(`count=${it.count}`);

    if (it.label) parts.push(qesc(it.label));
    out.push(parts.join(" "));
  });

}



// The colour system. Single source of truth for BOTH the CSS custom properties
// and the JS consumers that can't read them (canvas PNG export, the print-sheet
// stylesheet string, drill-svg.js's var() fallbacks, build-drill-preview.mjs —
// an <img>-loaded SVG has no host cascade, so those need literal values).
//
// Plain ESM with NO imports on purpose: vite.config.js, scripts/*.mjs and
// node tests/*.mjs all load this file directly.
//
// Naming: --db-<tier>[-<role>]. Two rules keep the system honest —
//   1. No token is named for a colour. `brand-red`, never `red`. `ui-select`
//      and `ice-select` are separate tokens that happen to share #ffd447 today;
//      that split is what stops on-ice amber leaking into chrome (and it lets
//      light mode darken the chrome one to clear contrast without touching ice).
//   2. The `ice-*` tier is a closed set and the ONLY tier the SVG consumes.

// else iterates. tests/theme-contrast.mjs will tell you which pairs it fails.

/* CSS emission                                                        */

const decls = t => Object.entries(THEMES[t]).map(([k, v]) => `--db-${k}:${v}`).join(";");

// Three layers, in this order:
//   1. :root                      — the zero-JS floor. Light tokens always exist.
//   2. @media prefers-color-scheme — upgrades to dark with no script at all.
//   3. :root[data-theme=…]        — the persisted manual override, wins on
//                                   specificity AND source order.
// The :not([data-theme]) in layer 2 is redundant given both of those; it's there
// so a future reorder of these blocks can't silently break the override.
function themeCss() {
  const blocks = [`:root{${decls("light")};color-scheme:${SCHEME.light}}`];
  for (const [query, name] of Object.entries(AUTO_MAP)) {
    if (name === "light") continue; // already the floor
    blocks.push(
      `@media (prefers-color-scheme:${query}){:root:not([${THEME_ATTR}]){` +
      `${decls(name)};color-scheme:${SCHEME[name] || name}}}`
    );
  }
  for (const name of Object.keys(THEMES)) {
    blocks.push(
      `:root[${THEME_ATTR}="${name}"]{${decls(name)};color-scheme:${SCHEME[name] || name}}`
    );
  }
  // The app's own background lives here rather than in styles.js because
  // styles.js is injected by React — this has to be right at first paint.
  blocks.push(`html,body{margin:0;padding:0;overflow:hidden;background:var(--db-surface-app)}`);
