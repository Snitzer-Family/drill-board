<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- opaque ("black") instead of black-translucent: iOS 26 sizes the
         standalone viewport for an opaque bar even in translucent mode,
         stranding a dead band at the bottom; opaque makes size and
         position coherent so the viewport reaches the physical bottom -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- opt into both schemes so the UA renders form controls, scrollbars and
         the pre-mount canvas to match; the per-theme pin lives in theme.js -->
    <meta name="color-scheme" content="light dark" />
    <!-- media-scoped so the launch paint is right with no script at all. iOS
         only consults these AT launch, and in standalone the status-bar-style
         above outranks them — so light mode keeps a black status band. That is
         accepted: reverting to "default" risks the iOS 26 dead-band bug. -->
    <meta name="theme-color" content="#e7edf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1014" media="(prefers-color-scheme: dark)" />
    <!-- hrefs are RELATIVE, which resolves against /drill-board/ in dev and in
         the build alike. %BASE_URL% is the documented mechanism and is wrong
         here: the dev server applies base a second time and serves
         /drill-board/drill-board/icon.svg. Everything below is generated by
         scripts/build-icons.mjs from src/app-icon.js — see public/. -->
    <!-- favicon.ico is NOT legacy cruft, it is the iOS Safari fallback: Safari
         does not support SVG favicons, so with only icon.svg it has no
         candidate and shows nothing at all in the tab. The .ico holds 16/32/48
         of the small (crease) rendition, since a raster can't evaluate the
         size media query inside icon.svg. It is listed FIRST and the SVG
         carries sizes="any", which is what makes Chrome/Firefox prefer the
         scalable one and leaves the .ico to Safari. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- pins the home-screen label, which today is only right by accident: it
         falls back to <title>, so the day anything sets document.title to
         include a drill name, every new install gets a truncated one -->
    <meta name="apple-mobile-web-app-title" content="DrillBoard" />
    <title>DrillBoard</title>
    <!-- filled by the injectTheme() plugin in vite.config.js, in dev AND build.
         The tokens must be here rather than in styles.js: styles.js is injected
         by React, which is far too late for the first paint. -->
    <!--theme-css-->
    <!--theme-boot-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
